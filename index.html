<title>EDUFLOW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: banco da disegno. Barra comandi in alto; sotto, due viste: diagramma (blocchi | tavola | pannelli) oppure pagina Codice (linguaggi | sorgente). */
:root{
  --bg:#e9edf3; --panel:#f8fafc; --ink:#0f1b2d; --muted:#586579; --line:#cbd4e0;
  --edge:#3a4a63; --stroke:#2a3b55; --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe6ff;
  --grid:#c3cddb; --f-decl:#e8edf4; --f-assign:#ffffff; --f-in:#dbe8ff; --f-out:#d9f2e6; --f-ctl:#fff0cc;
  --run:#ffd23f; --run-ink:#1d1500; --err:#c62828; --err-bg:#ffe1e1; --ok:#1b7a47; --shadow:rgba(15,27,45,.18);
  --hk:#0b5fa5; --hs:#1b7a47; --hn:#a8500a; --hc:#6b7a90;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111d; --panel:#111a2a; --ink:#dce6f7; --muted:#8a9ab3; --line:#22304a;
  --edge:#7d92b4; --stroke:#8da4c9; --accent:#6e9bff; --accent-ink:#0b111d; --accent-soft:#1c2c4d;
  --grid:#1a2538; --f-decl:#182236; --f-assign:#141d30; --f-in:#16305a; --f-out:#123a2c; --f-ctl:#3b2f12;
  --run:#e3b100; --run-ink:#1b1400; --err:#ff7a7a; --err-bg:#4a1a1a; --ok:#5ed49a; --shadow:rgba(0,0,0,.5);
  --hk:#7fb2ff; --hs:#6fd6a5; --hn:#f0b35c; --hc:#7284a0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111d; --panel:#111a2a; --ink:#dce6f7; --muted:#8a9ab3; --line:#22304a;
  --edge:#7d92b4; --stroke:#8da4c9; --accent:#6e9bff; --accent-ink:#0b111d; --accent-soft:#1c2c4d;
  --grid:#1a2538; --f-decl:#182236; --f-assign:#141d30; --f-in:#16305a; --f-out:#123a2c; --f-ctl:#3b2f12;
  --run:#e3b100; --run-ink:#1b1400; --err:#ff7a7a; --err-bg:#4a1a1a; --ok:#5ed49a; --shadow:rgba(0,0,0,.5);
  --hk:#7fb2ff; --hs:#6fd6a5; --hn:#f0b35c; --hc:#7284a0;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono)}

/* barra superiore */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:center;gap:8px;font:600 15px var(--mono);letter-spacing:.02em}
.brand svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sep{width:1px;align-self:stretch;background:var(--line)}
.grow{flex:1 1 0;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);
  background:var(--panel);border-radius:3px;cursor:pointer;white-space:nowrap}
.btn svg{width:14px;height:14px;fill:currentColor;stroke:currentColor;stroke-width:0}
.btn svg.st{fill:none;stroke-width:1.6}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.icon{width:30px;padding:0;justify-content:center}
select.btn{padding:0 6px;max-width:210px}
#pname{height:30px;width:190px;border:1px solid transparent;background:transparent;border-radius:3px;padding:0 8px;font-weight:600}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--panel)}
.speed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.speed input{width:84px;accent-color:var(--accent)}
body.cv .ed{display:none}

#views{min-height:0;min-width:0;display:grid}
#views>*{min-height:0;min-width:0}

/* area di lavoro */
.work{display:grid;grid-template-columns:158px minmax(0,1fr) 350px;gap:10px;min-height:0}
.stencil{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.stencil h4,.side h4{margin:0 0 4px;font:600 10.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.blk{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;text-align:left;font-family:var(--mono);font-size:12.5px}
.blk:hover{border-color:var(--accent);background:var(--accent-soft)}
.blk svg,.menu button svg{width:28px;height:18px;flex:none;fill:var(--g,var(--f-assign));stroke:var(--stroke);stroke-width:1.4;stroke-linejoin:round}
.blk[data-t=declare],.menu [data-t=declare]{--g:var(--f-decl)}
.blk[data-t=input],.menu [data-t=input]{--g:var(--f-in)}
.blk[data-t=output],.menu [data-t=output]{--g:var(--f-out)}
.blk[data-t=if],.blk[data-t=while],.blk[data-t=for],.blk[data-t=do],.menu [data-t=if],.menu [data-t=while],.menu [data-t=for],.menu [data-t=do]{--g:var(--f-ctl)}
.stencil p{margin:8px 2px 0;color:var(--muted);font-size:11.5px}
body.running .stencil,body.running .menu{pointer-events:none;opacity:.5}

.boardwrap{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--bg)}
.board{position:absolute;inset:0;overflow:auto;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:20px 20px;background-attachment:local}
.board.nogrid{background-image:none}
.board.pan{cursor:grabbing;user-select:none}
#host{display:flex;justify-content:center;width:max-content;min-width:100%}
#host svg{display:block;flex:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:3px;box-shadow:0 2px 8px var(--shadow)}
.zoom .btn{height:26px;border-color:transparent;background:transparent}
.zoom .z{min-width:46px;justify-content:center;font:12px var(--mono)}

.menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--stroke);border-radius:3px;padding:4px;box-shadow:0 6px 24px var(--shadow);display:flex;flex-direction:column;min-width:150px}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:8px;padding:5px 8px;border:0;background:transparent;border-radius:3px;cursor:pointer;text-align:left;font-family:var(--mono);font-size:12.5px}
.menu button:hover{background:var(--accent-soft)}

/* diagramma */
.e{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round}
#ah path{fill:var(--edge)}
.nd{cursor:pointer}
.nd .sh{fill:var(--f,var(--f-assign));stroke:var(--stroke);stroke-width:1.5}
.nd text{font:400 13px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.t-declare{--f:var(--f-decl)}.t-input{--f:var(--f-in)}.t-output{--f:var(--f-out)}
.t-if,.t-while,.t-for,.t-do{--f:var(--f-ctl)}
.t-comment .sh{fill:none;stroke-dasharray:4 3}.t-comment text{font-style:italic;fill:var(--muted)}
.nd:hover .sh{stroke:var(--accent)}
.nd.sel .sh{stroke:var(--accent);stroke-width:2.6}
.nd.err .sh{stroke:var(--err);stroke-dasharray:5 3}
.nd.run .sh{fill:var(--run);stroke:var(--run-ink)}
.nd.run text{fill:var(--run-ink)}
.nd.fail .sh{fill:var(--err-bg);stroke:var(--err);stroke-width:2.4;stroke-dasharray:none}
.term{cursor:default}.term .sh{fill:var(--ink);stroke:var(--ink)}.term text{fill:var(--bg);font-weight:600}
.lbl{font:600 11px var(--ui);fill:var(--muted)}
.slot{cursor:pointer}
.nd.dragsrc{opacity:.35}
.slot.dropping .dot{transform:scale(2.2);fill:var(--accent)}.slot.dropping.nodrop{display:none}
.slot.drop .dot{transform:scale(4.2);fill:var(--accent)}.slot.drop .plus{opacity:1}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}body.dragging .tip{display:none}
.dragghost{position:fixed;z-index:90;pointer-events:none;padding:4px 10px;background:var(--accent);color:#fff;border-radius:3px;font:600 12.5px var(--mono);box-shadow:0 4px 14px var(--shadow)}
.board.grabready,.board.grabready *{cursor:grab!important}
.blk{touch-action:pan-y}.foot .grow{flex:1}.slot .hit{fill:transparent}
.slot .dot{fill:var(--edge);transform-box:fill-box;transform-origin:center;transition:transform .1s}
.slot .plus{stroke:var(--accent-ink);stroke-width:1.6;opacity:0;pointer-events:none}
.slot:hover .dot{transform:scale(3.4);fill:var(--accent)}.slot:hover .plus{opacity:1}
body.running .slot{display:none}

/* colonna destra */
.side{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow-y:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px;min-width:0}
#props{flex:0 0 auto;max-height:40%;overflow:auto}
#vars{flex:0 0 auto;max-height:26%;overflow:auto}
#cons{flex:1 1 150px;display:flex;flex-direction:column;min-height:130px}
.card h3{margin:0 0 4px;font:600 14px var(--mono)}
.psub{margin:0 0 10px;color:var(--muted);font-size:12px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fld label{font-size:11.5px;color:var(--muted)}
.fld input[type=text],.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:5px 7px;font:13px var(--mono)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.errs{color:var(--err);font-size:12px;margin:0 0 8px;white-space:pre-line}
.errs:empty{display:none}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts .btn{height:26px;padding:0 8px;font-size:12px}
.help{color:var(--muted);font-size:12px}
.help p{margin:0 0 8px}
table{border-collapse:collapse;width:100%;font:12px var(--mono)}
th{font:600 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px 4px}
td{padding:2px 6px;border-top:1px solid var(--line);overflow-wrap:anywhere}
#vars td:nth-child(2){color:var(--muted)}
.chg td{animation:flash .7s}
@keyframes flash{from{background:var(--accent-soft)}}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.chead h4{margin:0}
#status{font:12px var(--mono);color:var(--muted)}
#con{flex:1;min-height:0;overflow:auto;margin:0;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:3px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
#con .err{color:var(--err)}#con .in{color:var(--accent)}#con .sys{color:var(--muted)}
#inform{display:flex;gap:6px;margin-top:6px}
#inform[hidden]{display:none}
#inform label{align-self:center;color:var(--muted);font-size:12px;max-width:45%}
#inval{flex:1;min-width:0;border:1px solid var(--accent);background:var(--bg);border-radius:3px;padding:4px 7px;font:13px var(--mono)}

#tutorCard{position:absolute;left:12px;bottom:12px;right:214px;max-width:660px;max-height:46%;overflow:auto;z-index:6;border-color:var(--accent);box-shadow:0 8px 28px var(--shadow);padding:8px 12px}
#tutorCard.moved{right:auto;bottom:auto;width:min(560px,calc(100% - 24px))}
#tutorCard .chead h4{cursor:grab;user-select:none}
#tutorCard .tmin{border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);padding:2px 6px}
#tutorCard.mini .tmsg,#tutorCard.mini .tans,#tutorCard.mini .tq,#tutorCard.mini .tdone,#tutorCard.mini .tscore{display:none}
#tutorCard .chead{align-items:center;flex-wrap:wrap}
#tutorCard .topts{display:flex;align-items:center;gap:8px;font-size:12px}
#tutorCard .topts label{display:flex;align-items:center;gap:4px;cursor:pointer}
#tutorCard .tstep{font:12px var(--mono);color:var(--muted);margin-bottom:4px}
#tutorCard .tmsg,#tutorCard .tans{margin:6px 0;line-height:1.5;font-size:13.5px}
#tutorCard code{font:12.5px var(--mono);background:var(--accent-soft);padding:0 4px;border-radius:3px}
#tutorCard .tdone{font-size:12px;color:var(--muted);margin:4px 0;line-height:1.7}
#tutorCard .tq{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;padding:8px;border:1px dashed var(--accent);border-radius:4px}
#tutorCard .tq span{display:flex;gap:6px}
#tutorCard .tans{padding:6px 8px;border-radius:4px;border-left:3px solid var(--line)}
#tutorCard .tans.ok{border-left-color:var(--ok,#2a8a4a)}#tutorCard .tans.no{border-left-color:var(--err)}
#tutorCard .tin{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding:8px;border:2px solid var(--accent);border-radius:4px;background:var(--accent-soft)}
#tutorCard .tin label{font-size:13px;font-weight:600}
#tutorCard .tin span{display:flex;gap:6px}
#tutorCard .tin input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:6px 8px;font:13px var(--mono)}
#tutorCard .tacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#tutorCard .tscore{font-size:12px;color:var(--muted);margin-top:6px}
#watchCard{flex:0 0 auto}
#watchCard input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:5px 7px;font:13px var(--mono)}
#watchCard input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
#watchCard .chead{margin-bottom:6px}
.wout{font:12.5px var(--mono);color:var(--accent);overflow-wrap:anywhere;text-align:right}
.wout.bad{color:var(--err)}
.bpd{fill:var(--err);stroke:var(--bg);stroke-width:1.5;pointer-events:none}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}

/* suggerimenti al passaggio del mouse */
.tip{position:fixed;z-index:70;max-width:min(370px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--stroke);border-radius:4px;padding:10px 12px;box-shadow:0 8px 28px var(--shadow);font-size:12.5px;line-height:1.45;pointer-events:none}
.tip[hidden]{display:none}
.tip .th{font:600 14px var(--mono);display:flex;justify-content:space-between;gap:12px}
.tip .th kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--muted);align-self:center}
.tip p{margin:4px 0}.tip .dim{color:var(--muted)}
.tip .tl{margin:9px 0 2px;font:600 10.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tip ul{margin:0;padding-left:16px}.tip li{margin:2px 0}
.tip code{font:12px var(--mono);background:var(--bg);padding:1px 5px;border-radius:2px;overflow-wrap:anywhere}
.tip .terr{color:var(--err);margin:0 0 6px}

/* EDUFLOW: marchio, caffè, sfide, traccia */
.bn{letter-spacing:.06em}.bn b{color:var(--accent);font-weight:600}
.btn.coffee{text-decoration:none;color:var(--ink)}
.btn.coffee svg{stroke:var(--hn)}
.btn.sm{height:22px;padding:0 8px;font-size:11.5px;margin-right:auto;margin-left:10px}
.chead h4{margin:0}
.chbar{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--accent);border-radius:3px;padding:4px 6px 4px 10px;box-shadow:0 2px 8px var(--shadow);z-index:2}
.chbar b{font:600 12.5px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chbar .btn{height:24px;padding:0 8px;font-size:12px}
.chl{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;flex:1;min-height:0}
.chlist{display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0}
.chlist button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:3px;padding:6px 8px;cursor:pointer;text-align:left}
.chlist button:hover{background:var(--accent-soft)}
.chlist button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.chlist .lv{font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chlist .ok{color:var(--ok);font-weight:600}
.chdet{overflow:auto;min-height:0;padding-right:6px}
.chdet h4{margin:0 0 4px;font:600 17px var(--ui)}
.chdet p{margin:6px 0;line-height:1.55;max-width:70ch}
.chdet .tl{margin:12px 0 4px;font:600 10.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chdet .acts{margin:12px 0}
.chdet .acts .btn{height:30px;font-size:13px}
.chdet .hintbox{background:var(--accent-soft);border-radius:3px;padding:8px 10px}
.chres{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chres div{border:1px solid var(--line);border-left-width:4px;border-radius:3px;padding:6px 10px;font:12.5px var(--mono);overflow-wrap:anywhere}
.chres .ok{border-left-color:var(--ok)}.chres .no{border-left-color:var(--err)}
.chres small{display:block;color:var(--muted);font:11.5px var(--ui)}
.chsum{font-weight:600;margin:8px 0 0}
.chsum.ok{color:var(--ok)}
.tracewrap{overflow:auto;min-height:0;border:1px solid var(--line);border-radius:3px}
.tracewrap table{margin:0;width:max-content;min-width:100%}
.tracewrap th,.tracewrap td{padding:4px 10px;white-space:nowrap;border-top:1px solid var(--line)}
.tracewrap th{position:sticky;top:0;background:var(--panel);font-family:var(--mono);text-transform:none;letter-spacing:0;border-top:0;color:var(--ink)}
.tracewrap td.ch{background:var(--accent-soft)}
.tracewrap td:first-child{color:var(--muted)}
.svgprev{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px;max-height:30vh;overflow:auto;text-align:center}
.svgprev img{max-width:100%;height:auto}

/* suggerimenti al passaggio del mouse */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.55);display:flex;align-items:center;justify-content:center;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--stroke);border-radius:4px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:14px;box-shadow:0 10px 40px var(--shadow)}
.sheet.wide{width:min(1000px,100%);height:min(740px,100%)}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet h3{margin:0;font:600 15px var(--ui)}
.tabs,.stabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;padding:3px 10px;border-radius:3px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet pre,.sheet textarea{margin:0;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px;font:12.5px/1.5 var(--mono);min-height:200px;max-height:52vh;width:100%;resize:vertical}
.sheet .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hint{color:var(--muted);font-size:12px}
.spane{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}

const SUP=['it','en'];

try{Object.assign(SET,JSON.parse(localStorage.getItem(SETK)||'{}'))}catch(e){}
let LANG=SUP.includes(SET.lang)?SET.lang:((typeof navigator!=='undefined'&&String(navigator.language||'').toLowerCase().startsWith('it'))?'it':'en');

function saveSet(){try{localStorage.setItem(SETK,JSON.stringify(SET))}catch(e){}}
function tget(o,k){return k.split('.').reduce((a,p)=>a==null?a:a[p],o)}
function t(k,...a){
  let v=tget(TXT[LANG],k);
  if(v===undefined)v=tget(TXT.en,k);
  if(typeof v==='function')return v(...a);
  return v===undefined?k:v;
}
const BN={declare:'Declare',assign:'Assign',input:'Input',output:'Output',if:'If',while:'While',for:'For',do:'Do While',comment:'Comment'};
const ORDER=['declare','assign','input','output','if','while','for','do','comment'];

/* funzioni disponibili: nome, firma, descrizione it, descrizione en, esempio */
const FUNCS=[
 ['sqrt','sqrt(x)','Radice quadrata','Square root','sqrt(16) → 4'],
 ['abs','abs(x)','Valore assoluto','Absolute value','abs(-3) → 3'],
 ['sin','sin(x)','Seno (x in radianti)','Sine (x in radians)','sin(0) → 0'],

 ['log','log(x)','Logaritmo naturale','Natural logarithm','log(1) → 0'],
 ['log10','log10(x)','Logaritmo in base 10','Base-10 logarithm','log10(1000) → 3'],

 ['int','int(x)','Parte intera (toglie i decimali)','Integer part (drops decimals)','int(-2.7) → -2'],
 ['sign','sign(x)','Segno: -1, 0 oppure 1','Sign: -1, 0 or 1','sign(-8) → -1'],
 ['pow','pow(x, y)','x elevato a y (come x ^ y)','x raised to y (same as x ^ y)','pow(2, 10) → 1024'],
 ['min','min(a, b)','Il minore fra due numeri','The smaller of two numbers','min(4, 9) → 4'],

const TXT={it:{},en:{}};

/* =============================== ITALIANO =============================== */
TXT.it={

  start:'Inizio',end:'Fine',yes:'Sì',no:'No',

/* =============================== MANUALE =============================== */
function opTable(){
  const r=[
   ['+  -  *  /','+  -  *  /',M('Somma, differenza, prodotto, divisione. La divisione dà sempre un numero con decimali.','Add, subtract, multiply, divide. Division always gives a number with decimals.'),'7 / 2 → 3.5'],
   ['%','%',M('Resto della divisione','Remainder of a division'),'7 % 3 → 1'],
   ['^','^',M('Potenza','Power'),'2 ^ 10 → 1024'],
   ['&','&',M('Unisce testi e numeri in un unico testo','Joins text and numbers into one text'),'"n=" & 5 → "n=5"'],
   ['==  !=  <  >  <=  >=','',M('Confronti (si può usare anche = per l\'uguaglianza e <> per la diversità)','Comparisons (= also works for equality and <> for inequality)'),'x >= 10'],
   ['and  or  not','',M('Logica: e, o, negazione (anche && || !)','Logic: and, or, negation (also && || !)'),'x > 0 and not done'],
  ];
  return '<table class="mt"><thead><tr><th>'+M('Operatore','Operator')+'</th><th>'+M('Cosa fa','What it does')+'</th><th>'+M('Esempio','Example')+'</th></tr></thead><tbody>'
   +r.map(x=>'<tr><td><code>'+x[0]+'</code></td><td>'+x[2]+'</td><td><code>'+x[3]+'</code></td></tr>').join('')+'</tbody></table>';
}
function funcTable(){
  const i=LANG==='it'?2:3;
  return '<table class="mt"><thead><tr><th>'+M('Funzione','Function')+'</th><th>'+M('Cosa fa','What it does')+'</th><th>'+M('Esempio','Example')+'</th></tr></thead><tbody>'
   +FUNCS.map(f=>'<tr><td><code>'+f[1]+'</code></td><td>'+f[i]+'</td><td><code>'+f[4]+'</code></td></tr>').join('')+'</tbody></table>';
}
function blockManual(){
  return ORDER.map(k=>{
    const b=t('blk.'+k);
    return '<div class="bman"><h4>'+BN[k]+'</h4><p><b>'+esc(b.short)+'</b> '+esc(b.long)+'</p>'
     +'<ul>'+b.fields.map(f=>'<li><b>'+esc(f[0])+'.</b> '+esc(f[1])+'</li>').join('')+'</ul>'
     +'<p class="ex"><span>'+t('tip.tags.example')+'</span> <code>'+esc(b.example)+'</code></p>'
     +'<p class="mtip"><span>'+t('tip.tags.tip')+'</span> '+esc(b.tip)+'</p></div>';
  }).join('');
}
function shortcutTable(){
  const r=[['Ctrl + Enter',M('Esegui','Run')],['Ctrl + Z',M('Annulla','Undo')],['Ctrl + Y / Ctrl + Shift + Z',M('Ripeti','Redo')],['F10',M('Passo (esegue un blocco)','Step (runs one block)')],['F9',M('Attiva o toglie il punto di interruzione','Toggle the breakpoint')],['Ctrl + D',M('Duplica il blocco selezionato','Duplicate the selected block')],['Ctrl + C / X / V',M('Copia, taglia, incolla il blocco selezionato (anche tra schede)','Copy, cut, paste the selected block (even between tabs)')],['Alt + F',M('Modalità Focus: nasconde i pannelli','Focus mode: hides the panels')],['Space + '+M('trascina','drag'),M('Sposta il diagramma da qualsiasi punto','Pan the diagram from anywhere')],['Delete',M('Elimina il blocco selezionato','Delete the selected block')],['Esc',M('Chiude menu e finestre','Closes menus and windows')],['Ctrl + '+M('rotella','wheel'),M('Zoom sul diagramma','Zoom the diagram')],[M('Trascina lo sfondo','Drag the background'),M('Sposta il diagramma','Pan the diagram')],[M('Doppio clic su un blocco','Double-click a block'),M('Porta il cursore nei suoi campi','Moves the cursor to its fields')]];
  return '<table class="mt"><tbody>'+r.map(x=>'<tr><td><code>'+x[0]+'</code></td><td>'+x[1]+'</td></tr>').join('')+'</tbody></table>';
}
function manualSections(){
  const IT=LANG==='it';
  return [
  {id:'start',h:M('Primi passi','Quick start'),b:IT?
   '<ol><li>Scegli un programma da <b>Esempi…</b> oppure premi <b>Nuovo</b>.</li><li>Aggiungi blocchi: clicca un blocco nel pannello a sinistra (si inserisce dopo quello selezionato) oppure clicca un punto <b>+</b> sul diagramma.</li><li>Seleziona un blocco e compila i suoi campi nel pannello a destra.</li><li>Premi <b>Esegui</b>. La <b>Console</b> mostra il risultato e <b>Variabili</b> mostra i valori.</li><li>Premi <b>Codice</b> per vedere lo stesso programma in 11 linguaggi.</li></ol>'
   :'<ol><li>Pick a program from <b>Examples…</b> or press <b>New</b>.</li><li>Add blocks: click a block in the left panel (it is inserted after the selected one) or click a <b>+</b> dot on the diagram.</li><li>Select a block and fill in its fields in the right panel.</li><li>Press <b>Run</b>. The <b>Console</b> shows the result and <b>Variables</b> shows the values.</li><li>Press <b>Code</b> to see the same program in 11 languages.</li></ol>'},
  {id:'ui',h:M('L\'area di lavoro','The workspace'),b:IT?
   '<p><b>Barra superiore.</b> Nome del programma, esempi, annulla e ripeti, i comandi di esecuzione, poi Codice, Esporta, Importa, Nuovo e Impostazioni.</p><p><b>Blocchi</b> (a sinistra). I mattoncini del diagramma. Passa il mouse su uno per leggerne la spiegazione.</p><p><b>Diagramma</b> (al centro). Clicca un blocco per selezionarlo. Trascina lo sfondo per spostarti. Con Ctrl e rotella fai zoom. I punti <b>+</b> fra i blocchi servono a inserirne di nuovi.</p><p><b>Pannello destro.</b> In alto le proprietà del blocco selezionato (o questa guida), poi le variabili e la console.</p>'
   :'<p><b>Top bar.</b> Program name, examples, undo and redo, the run controls, then Code, Export, Import, New and Settings.</p><p><b>Blocks</b> (left). The building pieces of the diagram. Hover over one to read its explanation.</p><p><b>Diagram</b> (center). Click a block to select it. Drag the background to pan. Ctrl and the wheel zoom. The <b>+</b> dots between blocks insert new ones.</p><p><b>Right panel.</b> At the top the selected block\'s properties (or this guide), then the variables and the console.</p>'},
  {id:'blocks',h:M('I blocchi','Blocks'),b:'<p>'+M('I comandi principali hanno il loro nome inglese, come nei linguaggi di programmazione.','The main commands keep their English names, as in programming languages.')+'</p>'+blockManual()},
  {id:'vars',h:M('Variabili e tipi','Variables and types'),b:IT?
   '<p>Una variabile è una scatola con un nome che contiene un valore. Va dichiarata con <b>Declare</b> prima dell\'uso.</p><table class="mt"><tbody><tr><td><code>Integer</code></td><td>Numeri interi: 3, -12, 0</td></tr><tr><td><code>Real</code></td><td>Numeri con decimali: 3.14, -0.5</td></tr><tr><td><code>String</code></td><td>Testo, fra virgolette: "ciao"</td></tr><tr><td><code>Boolean</code></td><td>Vero o falso: <code>true</code>/<code>false</code> (anche <code>vero</code>/<code>falso</code>)</td></tr></tbody></table><p><b>Array.</b> Indica una dimensione in Declare, per esempio 10. Gli elementi si numerano da 0: <code>v[0]</code> è il primo, <code>v[9]</code> l\'ultimo. Un indice fuori dai limiti ferma il programma con un errore.</p><p><b>Valore iniziale.</b> 0 per i numeri, testo vuoto per le stringhe, falso per i Boolean.</p><p><b>Tipi e assegnazioni.</b> Una variabile accetta solo valori del suo tipo. Un Real assegnato a un Integer perde i decimali. Una variabile del blocco For si crea da sola se non esiste.</p>'
   :'<p>A variable is a named box that holds a value. Declare it with <b>Declare</b> before using it.</p><table class="mt"><tbody><tr><td><code>Integer</code></td><td>Whole numbers: 3, -12, 0</td></tr><tr><td><code>Real</code></td><td>Numbers with decimals: 3.14, -0.5</td></tr><tr><td><code>String</code></td><td>Text, in quotes: "hello"</td></tr><tr><td><code>Boolean</code></td><td>True or false: <code>true</code>/<code>false</code> (<code>vero</code>/<code>falso</code> also work)</td></tr></tbody></table><p><b>Arrays.</b> Give a size in Declare, for example 10. Elements are numbered from 0: <code>v[0]</code> is the first, <code>v[9]</code> the last. An index out of range stops the program with an error.</p><p><b>Starting value.</b> 0 for numbers, empty text for strings, false for Booleans.</p><p><b>Types and assignments.</b> A variable only accepts values of its type. A Real assigned to an Integer loses its decimals. A For variable is created automatically if it does not exist.</p>'},
  {id:'expr',h:M('Espressioni','Expressions'),b:'<p>'+M('Un\'espressione combina valori, variabili, operatori e funzioni. Il testo va fra virgolette doppie o singole; dentro il testo <code>\\n</code> va a capo. La costante <code>pi</code> è già disponibile.','An expression combines values, variables, operators and functions. Text goes in double or single quotes; inside text <code>\\n</code> is a new line. The constant <code>pi</code> is built in.')+'</p>'+opTable()
   +'<p>'+M('<b>Precedenza</b> (dalla più forte): potenza, segno meno, <code>* / %</code>, <code>+ -</code>, <code>&amp;</code>, confronti, <code>not</code>, <code>and</code>, <code>or</code>. Le parentesi cambiano l\'ordine: <code>(a + b) * c</code>.','<b>Precedence</b> (strongest first): power, minus sign, <code>* / %</code>, <code>+ -</code>, <code>&amp;</code>, comparisons, <code>not</code>, <code>and</code>, <code>or</code>. Parentheses change the order: <code>(a + b) * c</code>.')+'</p>'},
  {id:'funcs',h:M('Funzioni','Functions'),b:funcTable()},
  {id:'run',h:M('Eseguire un programma','Running a program'),b:IT?
   '<p><b>Esegui</b> avvia tutto. <b>Passo</b> esegue un blocco alla volta: il blocco in corso si colora di giallo e le variabili che cambiano lampeggiano. <b>Pausa</b> sospende, <b>Stop</b> interrompe. Il cursore <b>Velocità</b> regola l\'attesa fra i blocchi.</p><p><b>Input.</b> Quando il programma arriva a un blocco Input compare un campo sotto la console. Scrivi il valore e premi Invio. Se il valore non è del tipo giusto, viene richiesto.</p><p><b>Errori.</b> Se qualcosa non va, il blocco responsabile diventa rosso e la console spiega il motivo. Un blocco con il bordo rosso tratteggiato ha un campo non valido anche prima di eseguire.</p><p><b>Programmi che non finiscono.</b> Dopo 30 milioni di passi il programma si ferma da solo. Puoi sempre premere Stop.</p><p>Durante l\'esecuzione il diagramma è bloccato: ferma il programma per modificarlo.</p>'
   :'<p><b>Run</b> starts everything. <b>Step</b> runs one block at a time: the current block turns yellow and the variables that change flash. <b>Pause</b> suspends, <b>Stop</b> ends. The <b>Speed</b> slider sets the wait between blocks.</p><p><b>Input.</b> When the program reaches an Input block, a field appears under the console. Type the value and press Enter. If the value is not of the right type, it is asked again.</p><p><b>Errors.</b> If something goes wrong, the responsible block turns red and the console explains why. A block with a dashed red outline has an invalid field even before running.</p><p><b>Programs that never end.</b> After 30 million steps the program stops by itself. You can always press Stop.</p><p>While running, the diagram is locked: stop the program to edit it.</p>'},
  {id:'debug',h:M('Debug: interruzioni e osserva','Debugging: breakpoints and watch'),b:IT?
   '<p><b>Punto di interruzione.</b> Seleziona un blocco e premi il pulsante <b>Punto di interruzione</b> (oppure F9): compare un pallino rosso. Quando il programma sta per eseguire quel blocco si mette in pausa. Continua con <b>Continua</b> o avanza con <b>Passo</b> (F10). In un ciclo la pausa avviene a ogni giro. Le interruzioni si salvano con il programma.</p><p><b>Osserva.</b> Nella casella <b>Osserva</b> scrivi un\'espressione, per esempio <code>sum * 2</code> o <code>v[i] &gt; 5</code>: il valore si aggiorna a ogni blocco durante l\'esecuzione.</p>'
   :'<p><b>Breakpoint.</b> Select a block and press the <b>Breakpoint</b> button (or F9): a red dot appears. When the program is about to run that block it pauses. Go on with <b>Continue</b> or advance with <b>Step</b> (F10). Inside a loop it pauses on every turn. Breakpoints are saved with the program.</p><p><b>Watch.</b> In the <b>Watch</b> box type an expression, for example <code>sum * 2</code> or <code>v[i] &gt; 5</code>: its value updates at every block while the program runs.</p>'},
  {id:'edit',h:M('Lavorare più in fretta','Working faster'),b:IT?
   '<ul><li><b>Trascinare.</b> Trascina un blocco dal pannello a sinistra e rilascialo su un punto <b>+</b>; trascina un blocco del diagramma per spostarlo (anche dentro un If o un ciclo). Esc annulla.</li><li><b>Copia, taglia, incolla.</b> Con un blocco selezionato usa Ctrl+C, Ctrl+X, Ctrl+V (o i pulsanti Copia e Incolla): il blocco si incolla dopo quello selezionato, con tutto ciò che contiene. Il testo copiato si può incollare anche in un\'altra scheda di EDUFLOW.</li><li><b>Pannelli.</b> I tre pulsanti in alto a destra sulla tavola nascondono il pannello dei blocchi, quello laterale o entrambi (<b>Focus</b>, Alt+F). Trascina il bordo del pannello laterale per allargarlo. Quando avvii il programma il pannello laterale si riapre, così vedi console e variabili.</li><li><b>Programmi.</b> Il pulsante <b>Programmi</b> salva più programmi in questo browser: dagli un nome, riaprili o eliminali.</li><li><b>Muovere la tavola.</b> Trascina lo sfondo, oppure tieni premuto Spazio (o il tasto centrale del mouse) e trascina da qualsiasi punto.</li></ul>'
   :'<ul><li><b>Dragging.</b> Drag a block from the left panel and drop it on a <b>+</b> dot; drag a block in the diagram to move it (even inside an If or a loop). Esc cancels.</li><li><b>Copy, cut, paste.</b> With a block selected use Ctrl+C, Ctrl+X, Ctrl+V (or the Copy and Paste buttons): the block is pasted after the selected one, with everything inside. The copied text can also be pasted in another EDUFLOW tab.</li><li><b>Panels.</b> The three buttons at the top right of the board hide the blocks panel, the side panel or both (<b>Focus</b>, Alt+F). Drag the edge of the side panel to widen it. When you start the program the side panel reopens so you can see the console and variables.</li><li><b>Programs.</b> The <b>Programs</b> button saves several programs in this browser: give them a name, reopen or delete them.</li><li><b>Moving the board.</b> Drag the background, or hold Space (or the middle mouse button) and drag from anywhere.</li></ul>'},
  {id:'tutor',h:M('Modalità Tutor','Tutor mode'),b:IT?
   '<p><b>Modalità Tutor.</b> Premi <b>Tutor</b> nella barra (o attivala nelle Impostazioni). Con il tutor acceso l\'esecuzione si ferma a ogni blocco e il pannello <b>Tutor</b> spiega, con i valori reali, cosa sta per succedere: «calcolo <code>a + b</code> → <code>3 + 4</code> = 7, poi lo metto nella scatola <code>s</code>». Sotto vedi <b>Appena successo</b>, cioè quali variabili sono cambiate.</p><ul><li><b>Avanti</b> passa al blocco dopo; <b>Esegui tutto</b> finisce senza più pause; <b>Perché?</b> apre la spiegazione completa del blocco.</li><li><b>Previsioni:</b> davanti a un If, While o Do While il tutor chiede «vera o falsa?» prima di dirlo. Ti accorgi se hai capito davvero e il punteggio resta in basso.</li><li><b>Livello:</b> Principiante usa esempi con le scatole e spiega ogni passaggio; Normale è più breve.</li><li>Se c\'è un errore, il tutor lo spiega in parole semplici e suggerisce cosa controllare.</li></ul>'
   :'<p><b>Tutor mode.</b> Press <b>Tutor</b> in the bar (or turn it on in Settings). With the tutor on, the run pauses at every block and the <b>Tutor</b> panel explains, with the real values, what is about to happen: “I calculate <code>a + b</code> → <code>3 + 4</code> = 7, then put it in the box <code>s</code>”. Below you see <b>Just happened</b>: which variables changed.</p><ul><li><b>Next</b> goes to the next block; <b>Run all</b> finishes with no more pauses; <b>Why?</b> opens the full explanation of the block.</li><li><b>Predictions:</b> before an If, While or Do While the tutor asks “true or false?” before telling you. You see whether you really understood, and the score stays at the bottom.</li><li><b>Level:</b> Beginner uses box examples and explains every step; Normal is shorter.</li><li>If there is an error, the tutor explains it in plain words and suggests what to check.</li></ul>'},
  {id:'code',h:M('La pagina Codice','The Code page'),b:IT?
   '<p>Il pulsante <b>Codice</b> apre una pagina con il programma tradotto in <b>JavaScript, Python, Java, C, C++, C#, Go, PHP, Ruby, Kotlin e Swift</b>. Scegli il linguaggio dall\'elenco, oppure attiva «Mostra tutti i linguaggi» per vederli uno sotto l\'altro. Ogni scheda ha il comando per eseguire il file e il pulsante Copia.</p><p><b>Cosa tenere presente.</b></p><ul><li>La divisione dà sempre un risultato con decimali, come nel diagramma.</li><li>Un numero con decimali assegnato a un Integer viene convertito in intero troncando.</li><li>I Boolean si stampano come <code>true</code>/<code>false</code> o <code>True</code>/<code>False</code>, secondo il linguaggio.</li><li>In C le stringhe sono array di caratteri: alcune funzioni di testo non sono tradotte e la pagina lo segnala.</li><li>Il codice per JavaScript funziona con Node.js e legge l\'Input dallo standard input.</li></ul><p>Ogni scheda indica se il codice è stato provato con un compilatore o un interprete reale.</p>'
   :'<p>The <b>Code</b> button opens a page with the program translated to <b>JavaScript, Python, Java, C, C++, C#, Go, PHP, Ruby, Kotlin and Swift</b>. Pick the language from the list, or turn on “Show all languages” to see them one under the other. Each card has the command to run the file and a Copy button.</p><p><b>Things to keep in mind.</b></p><ul><li>Division always gives a result with decimals, as in the diagram.</li><li>A number with decimals assigned to an Integer is converted by truncation.</li><li>Booleans print as <code>true</code>/<code>false</code> or <code>True</code>/<code>False</code>, depending on the language.</li><li>In C, strings are character arrays: some text functions are not translated and the page says so.</li><li>The JavaScript code runs on Node.js and reads Input from standard input.</li></ul><p>Each card says whether the code was tested with a real compiler or interpreter.</p>'},
  {id:'extra',h:M('Sfide, traccia e immagini','Challenges, trace and images'),b:IT?
   '<p><b>Sfide.</b> Il pulsante <b>Sfide</b> elenca esercizi di tre livelli. Premi <b>Inizia</b> per un diagramma vuoto, costruisci la soluzione e premi <b>Controlla la mia soluzione</b>: EDUFLOW esegue il programma con più valori di prova e confronta ciò che scrive con il risultato atteso (maiuscole e spazi non contano). Conta solo ciò che scrivono i blocchi Output. Ogni sfida ha un suggerimento e una soluzione da consultare, e i progressi restano in questo browser.</p><p><b>Tabella di traccia.</b> Dopo un\'esecuzione, <b>Traccia</b> nella console mostra una riga per ogni blocco con il valore di tutte le variabili. È il modo classico per verificare a mano un algoritmo.</p><p><b>Immagine SVG.</b> In <b>Esporta</b> la scheda «Immagine SVG» mostra il diagramma come immagine vettoriale: copia il testo e salvalo come file .svg, oppure incollalo in un documento o in una presentazione.</p>'
   :'<p><b>Challenges.</b> The <b>Challenges</b> button lists exercises at three levels. Press <b>Start</b> for an empty diagram, build the solution and press <b>Check my solution</b>: EDUFLOW runs the program with several sample values and compares what it writes with the expected result (case and spacing do not matter). Only what Output blocks write counts. Each challenge has a hint and a solution to look at, and your progress stays in this browser.</p><p><b>Trace table.</b> After a run, <b>Trace</b> in the console shows one row per block with the value of every variable. It is the classic way to check an algorithm by hand.</p><p><b>SVG image.</b> In <b>Export</b> the “SVG image” tab shows the diagram as a vector image: copy the text and save it as an .svg file, or paste it into a document or a presentation.</p>'},
  {id:'save',h:M('Salvare, esportare, importare','Saving, exporting, importing'),b:IT?
   '<p>Il programma si salva da solo in questo browser a ogni modifica e riappare quando riapri la pagina. <b>Esporta</b> mostra il programma come testo: copialo e conservalo dove vuoi. <b>Importa</b> lo riapre da testo incollato o da un file. La cronologia di Annulla conserva fino a 200 modifiche.</p>'
   :'<p>The program saves itself in this browser after every change and comes back when you reopen the page. <b>Export</b> shows the program as text: copy it and keep it wherever you like. <b>Import</b> reopens it from pasted text or from a file. The Undo history keeps up to 200 changes.</p>'},
  {id:'keys',h:M('Scorciatoie','Shortcuts'),b:shortcutTable()},
  {id:'faq',h:M('Problemi comuni','Troubleshooting'),b:IT?
   '<dl><dt>«La variabile "x" non è stata dichiarata»</dt><dd>Aggiungi un blocco Declare per x prima del punto in cui la usi.</dd><dt>Un blocco ha il bordo rosso tratteggiato</dt><dd>Passa il mouse sul blocco: la spiegazione dice quale campo è sbagliato. Controlla virgolette e parentesi.</dd><dt>Il programma non finisce mai</dt><dd>In un While o Do While, qualcosa dentro il ciclo deve cambiare la condizione. Premi Stop.</dd><dt>«L\'operatore + richiede due numeri»</dt><dd>Stai sommando un testo e un numero. Usa <code>&amp;</code> per unirli.</dd><dt>Un numero con la virgola non viene letto</dt><dd>Nei campi del diagramma usa il punto: <code>2.5</code>. Nei valori digitati in Input vanno bene sia il punto sia la virgola.</dd><dt>Il risultato del codice generato è diverso</dt><dd>Controlla le note nella pagina Codice: i formati di stampa dei numeri decimali e dei Boolean cambiano da un linguaggio all\'altro.</dd></dl>'
   :'<dl><dt>“Variable "x" has not been declared”</dt><dd>Add a Declare block for x before the point where you use it.</dd><dt>A block has a dashed red outline</dt><dd>Hover over the block: the explanation says which field is wrong. Check quotes and parentheses.</dd><dt>The program never ends</dt><dd>In a While or Do While, something inside the loop must change the condition. Press Stop.</dd><dt>“The operator + needs two numbers”</dt><dd>You are adding a text and a number. Use <code>&amp;</code> to join them.</dd><dt>A number with a comma is not read</dt><dd>In diagram fields use a dot: <code>2.5</code>. In values typed into Input, both dot and comma work.</dd><dt>The generated code gives a different result</dt><dd>Check the notes on the Code page: print formats for decimals and Booleans differ between languages.</dd></dl>'},
  ];
}

/* ---------- utilità ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
class SynErr extends Error{}
class RunErr extends Error{}
class StopErr extends Error{}
const kind=v=>typeof v==='number'?M('un numero','a number'):typeof v==='string'?M('del testo','text'):M('un valore vero/falso','a true/false value');
const fmtBool=b=>LANG==='it'?(b?'vero':'falso'):(b?'true':'false');
function fmt(v){
  if(typeof v==='number')return Number.isInteger(v)?String(v):String(+v.toPrecision(12));
  if(typeof v==='boolean')return fmtBool(v);
  return String(v);
}

/* ---------- espressioni: tokenizer e parser ---------- */
function tokenize(s){
  const tk=[];let i=0;
  const isD=c=>c>='0'&&c<='9';
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(isD(c)||(c==='.'&&isD(s[i+1]||''))){
      let j=i;while(isD(s[j]||''))j++;
      if(s[j]==='.'){j++;while(isD(s[j]||''))j++}
      tk.push({t:'num',v:parseFloat(s.slice(i,j))});i=j;continue}
    if(c==='"'||c==="'"){
      let j=i+1,v='';
      for(;;){
        if(j>=s.length)throw new SynErr(M('Stringa non chiusa: manca ','Unclosed string: missing ')+c);
        const d=s[j];
        if(d==='\\'){const e=s[j+1];v+=e==='n'?'\n':e==='t'?'\t':(e||'');j+=2;continue}
        if(d===c){j++;break}
        v+=d;j++}
      tk.push({t:'str',v});i=j;continue}
    if(/[\p{L}_]/u.test(c)){
      let j=i+1;while(j<s.length&&/[\p{L}\p{N}_]/u.test(s[j]))j++;
      const id=s.slice(i,j),lw=id.toLowerCase();
      if(lw==='and'||lw==='or'||lw==='not')tk.push({t:'op',v:lw});
      else if(lw==='vero'||lw==='true')tk.push({t:'bool',v:true});
      else if(lw==='falso'||lw==='false')tk.push({t:'bool',v:false});
      else tk.push({t:'id',v:id});
      i=j;continue}
    const two=s.slice(i,i+2);
    if(['==','!=','<>','<=','>=','&&','||'].includes(two)){tk.push({t:'op',v:two});i+=2;continue}
    if('+-*/%^&<>=!(),[]'.includes(c)){tk.push({t:'op',v:c});i++;continue}
    throw new SynErr(M('Carattere non valido: ','Invalid character: ')+c);
  }
  return tk;
}
function parseExpr(src){
  const tk=tokenize(src);
  if(!tk.length)throw new SynErr(M('Il campo è vuoto','The field is empty'));
  let p=0;
  const pk=()=>tk[p];
  const isOp=(...v)=>pk()&&pk().t==='op'&&v.includes(pk().v);
  const take=()=>tk[p++];
  const orE=()=>{let l=andE();while(isOp('or','||')){take();l={k:'bin',op:'or',l,r:andE()}}return l};
  const andE=()=>{let l=notE();while(isOp('and','&&')){take();l={k:'bin',op:'and',l,r:notE()}}return l};
  const notE=()=>{if(isOp('not','!')){take();return{k:'un',op:'not',e:notE()}}return cmp()};
  const cmp=()=>{let l=cat();while(isOp('==','!=','<>','<','>','<=','>=','=')){let op=take().v;if(op==='=')op='==';if(op==='<>')op='!=';l={k:'bin',op,l,r:cat()}}return l};
  const cat=()=>{let l=add();while(isOp('&')){take();l={k:'bin',op:'&',l,r:add()}}return l};
  const add=()=>{let l=mul();while(isOp('+','-')){const op=take().v;l={k:'bin',op,l,r:mul()}}return l};
  const mul=()=>{let l=unary();while(isOp('*','/','%')){const op=take().v;l={k:'bin',op,l,r:unary()}}return l};
  const unary=()=>{if(isOp('-')){take();return{k:'un',op:'-',e:unary()}}if(isOp('+')){take();return unary()}return pow()};
  const pow=()=>{const b=prim();if(isOp('^')){take();return{k:'bin',op:'^',l:b,r:unary()}}return b};
  const prim=()=>{
    const tkn=take();
    if(!tkn)throw new SynErr(M('Espressione incompleta','Incomplete expression'));
    if(tkn.t==='num')return{k:'num',v:tkn.v};
    if(tkn.t==='str')return{k:'str',v:tkn.v};
    if(tkn.t==='bool')return{k:'bool',v:tkn.v};
    if(tkn.t==='id'){
      if(isOp('(')){
        take();const a=[];
        if(!isOp(')')){do{a.push(orE())}while(isOp(',')&&take())}
        if(!isOp(')'))throw new SynErr(M('Manca la parentesi chiusa )','Missing closing parenthesis )'));
        take();
        const f=FN[tkn.v];
        if(!f)throw new SynErr(M('Funzione sconosciuta: ','Unknown function: ')+tkn.v);
        if(a.length!==f.n)throw new SynErr(M(tkn.v+'() vuole '+f.n+(f.n===1?' argomento':' argomenti'),tkn.v+'() takes '+f.n+(f.n===1?' argument':' arguments')));
        return{k:'call',f:tkn.v,a};
      }
      if(isOp('[')){
        take();const i=orE();
        if(!isOp(']'))throw new SynErr(M('Manca la parentesi quadra chiusa ]','Missing closing bracket ]'));
        take();return{k:'idx',n:tkn.v,i};
      }
      return{k:'var',n:tkn.v};
    }
    if(tkn.v==='('){const e=orE();if(!isOp(')'))throw new SynErr(M('Manca la parentesi chiusa )','Missing closing parenthesis )'));take();return e}
    throw new SynErr(M('Simbolo inatteso: ','Unexpected symbol: ')+tkn.v);
  };
  const e=orE();
  if(p<tk.length)throw new SynErr(M('Simbolo inatteso: ','Unexpected symbol: ')+tk[p].v);
  return e;
}
const pcache=new Map();
function parseC(src){
  let r=pcache.get(src);
  if(!r){
    try{r={ast:parseExpr(src)}}catch(e){if(!(e instanceof SynErr))throw e;r={err:e.message}}
    if(pcache.size>3000)pcache.clear();
    pcache.set(src,r);
  }
  return r;
}
const IDENT=/^[\p{L}_][\p{L}\p{N}_]*$/u;
const RESERVED=new Set(['and','or','not','vero','falso','true','false']);
function identErr(s){
  s=(s||'').trim();
  if(!s)return M('Manca il nome della variabile','The variable name is missing');
  if(!IDENT.test(s)||RESERVED.has(s.toLowerCase()))return M('Nome non valido: usa lettere, cifre e _, senza iniziare con una cifra','Invalid name: use letters, digits and _, not starting with a digit');
  return '';
}
function targetErr(src){
  const r=parseC(src||'');
  if(r.err)return r.err;
  if(r.ast.k!=='var'&&r.ast.k!=='idx')return M('Deve essere una variabile, per esempio x oppure v[i]','Must be a variable, for example x or v[i]');
  return '';
}
const LAB={size:()=>M('Dimensione','Size'),var:()=>M('Variabile','Variable'),expr:()=>M('Espressione','Expression'),cond:()=>M('Condizione','Condition'),from:()=>M('Da','From'),to:()=>M('A','To'),step:()=>M('Passo','Step')};
function nodeErrors(n){
  const e=[],ex=(s,l)=>{const r=parseC(s||'');if(r.err)e.push(LAB[l]()+': '+r.err)};
  switch(n.type){
    case 'declare':{const m=identErr(n.name);if(m)e.push(m);if((n.size||'').trim())ex(n.size,'size');break}
    case 'assign':{const m=targetErr(n.target);if(m)e.push(LAB.var()+': '+m);ex(n.expr,'expr');break}
    case 'input':{const m=targetErr(n.name);if(m)e.push(LAB.var()+': '+m);break}
    case 'output':ex(n.expr,'expr');break;
    case 'if':case 'while':case 'do':ex(n.cond,'cond');break;
    case 'for':{const m=identErr(n.v);if(m)e.push(m);ex(n.from,'from');ex(n.to,'to');if((n.step||'').trim())ex(n.step,'step');break}
  }
  return e;
}

/* ---------- funzioni disponibili ---------- */
const needNum=(x,f)=>{if(typeof x!=='number')throw new RunErr(f+M('() richiede un numero','() needs a number'));return x};
const M1=(name,f)=>[name,{n:1,run:x=>f(needNum(x,name))}];
const needTxt=(s,f)=>{if(typeof s!=='string')throw new RunErr(f+M('() richiede un testo','() needs a text'));return s};
const FN=Object.fromEntries([
  M1('sqrt',x=>{if(x<0)throw new RunErr(M('sqrt() di un numero negativo','sqrt() of a negative number'));return Math.sqrt(x)}),
  M1('abs',Math.abs),M1('sin',Math.sin),M1('cos',Math.cos),M1('tan',Math.tan),
  M1('log',x=>{if(x<=0)throw new RunErr(M('log() richiede un numero positivo','log() needs a positive number'));return Math.log(x)}),
  M1('log10',x=>{if(x<=0)throw new RunErr(M('log10() richiede un numero positivo','log10() needs a positive number'));return Math.log10(x)}),
  M1('exp',Math.exp),M1('floor',Math.floor),M1('ceil',Math.ceil),M1('round',Math.round),M1('int',Math.trunc),M1('sign',Math.sign),
  ['pow',{n:2,run:(a,b)=>Math.pow(needNum(a,'pow'),needNum(b,'pow'))}],
  ['min',{n:2,run:(a,b)=>Math.min(needNum(a,'min'),needNum(b,'min'))}],
  ['max',{n:2,run:(a,b)=>Math.max(needNum(a,'max'),needNum(b,'max'))}],
  ['random',{n:1,run:x=>{needNum(x,'random');if(!Number.isInteger(x)||x<1)throw new RunErr(M('random(n) richiede un intero maggiore di 0','random(n) needs an integer greater than 0'));return Math.floor(Math.random()*x)}}],
  ['len',{n:1,run:s=>{if(typeof s!=='string')throw new RunErr(M('len() richiede un testo o un array','len() needs a text or an array'));return s.length}}],
  ['upper',{n:1,run:s=>needTxt(s,'upper').toUpperCase()}],
  ['lower',{n:1,run:s=>needTxt(s,'lower').toLowerCase()}],
  ['substr',{n:3,run:(s,a,b)=>needTxt(s,'substr').substr(needNum(a,'substr'),needNum(b,'substr'))}],
  ['str',{n:1,run:x=>fmt(x)}],
  ['num',{n:1,run:s=>{const v=typeof s==='number'?s:Number(String(s).replace(',','.'));if(String(s).trim()===''||!Number.isFinite(v))throw new RunErr(M('num() non riesce a convertire "','num() cannot convert "')+s+'"');return v}}],
]);

/* ---------- valutazione ---------- */
function evalA(a,env){
  switch(a.k){
    case 'num':case 'str':case 'bool':return a.v;
    case 'var':{
      const v=env.get(a.n);
      if(!v){if(a.n==='pi')return Math.PI;throw new RunErr(M('La variabile "'+a.n+'" non è stata dichiarata','Variable "'+a.n+'" has not been declared'))}
      if(v.arr)throw new RunErr(M('"'+a.n+'" è un array: usa '+a.n+'[indice]','"'+a.n+'" is an array: use '+a.n+'[index]'));
      return v.value;
    }
    case 'idx':{
      const v=env.get(a.n);
      if(!v)throw new RunErr(M('La variabile "'+a.n+'" non è stata dichiarata','Variable "'+a.n+'" has not been declared'));
      if(!v.arr)throw new RunErr(M('"'+a.n+'" non è un array','"'+a.n+'" is not an array'));
      const i=evalA(a.i,env);
      if(!Number.isInteger(i)||i<0||i>=v.value.length)throw new RunErr(M('Indice fuori limiti: ','Index out of range: ')+a.n+'['+fmt(i)+M('] (dimensione ','] (size ')+v.value.length+')');
      return v.value[i];
    }
    case 'un':{
      const x=evalA(a.e,env);
      if(a.op==='not'){if(typeof x!=='boolean')throw new RunErr(M('"not" richiede un valore vero/falso','"not" needs a true/false value'));return !x}
      return -needNum(x,M('Il segno meno','The minus sign'));
    }
    case 'call':{
      if(a.f==='len'&&a.a[0].k==='var'){const v=env.get(a.a[0].n);if(v&&v.arr)return v.value.length}
      return FN[a.f].run(...a.a.map(x=>evalA(x,env)));
    }
    case 'bin':{
      const op=a.op;
      if(op==='and'||op==='or'){
        const l=evalA(a.l,env);
        if(typeof l!=='boolean')throw new RunErr(M('"'+op+'" richiede valori vero/falso','"'+op+'" needs true/false values'));
        if(op==='and'?!l:l)return l;
        const r=evalA(a.r,env);
        if(typeof r!=='boolean')throw new RunErr(M('"'+op+'" richiede valori vero/falso','"'+op+'" needs true/false values'));
        return r;
      }
      const l=evalA(a.l,env),r=evalA(a.r,env);
      const nn=()=>{if(typeof l!=='number'||typeof r!=='number')throw new RunErr(M('L\'operatore '+op+' richiede due numeri, ma ha ricevuto '+kind(l)+' e '+kind(r),'The operator '+op+' needs two numbers, but got '+kind(l)+' and '+kind(r)))};
      switch(op){
        case '+':if(typeof l==='string'||typeof r==='string')return fmt(l)+fmt(r);nn();return l+r;
        case '&':return fmt(l)+fmt(r);
        case '-':nn();return l-r;
        case '*':nn();return l*r;
        case '/':nn();if(r===0)throw new RunErr(M('Divisione per zero','Division by zero'));return l/r;
        case '%':nn();if(r===0)throw new RunErr(M('Resto della divisione per zero','Remainder by zero'));return l%r;
        case '^':nn();return Math.pow(l,r);
        case '==':return l===r;
        case '!=':return l!==r;
        default:{
          if(typeof l!==typeof r||typeof l==='boolean')throw new RunErr(M('Non posso confrontare ','Cannot compare ')+kind(l)+M(' con ',' with ')+kind(r));
          return op==='<'?l<r:op==='>'?l>r:op==='<='?l<=r:l>=r;
        }
      }
    }
  }
}
const DEF={Integer:0,Real:0,String:'',Boolean:false};
function coerce(ty,val,name){
  const bad=()=>{throw new RunErr(M('"'+name+'" è di tipo '+tl(ty)+': non può contenere '+kind(val),'"'+name+'" is of type '+tl(ty)+': it cannot hold '+kind(val)))};
  switch(ty){
    case 'Integer':case 'Real':
      if(typeof val!=='number')bad();
      if(!Number.isFinite(val))throw new RunErr(M('Il risultato non è un numero valido','The result is not a valid number'));
      return ty==='Integer'?Math.trunc(val):val;
    case 'String':if(typeof val!=='string')bad();return val;
    default:if(typeof val!=='boolean')bad();return val;
  }
}
function parseInput(raw,type){
  const s=String(raw);
  if(type==='Integer'){if(!/^\s*[-+]?\d+\s*$/.test(s))throw new RunErr(M('Valore non valido: serve un numero intero','Invalid value: an integer is required'));return parseInt(s,10)}
  if(type==='Real'){const v=Number(s.replace(',','.'));if(s.trim()===''||!Number.isFinite(v))throw new RunErr(M('Valore non valido: serve un numero','Invalid value: a number is required'));return v}
  if(type==='Boolean'){const l=s.trim().toLowerCase();if(['vero','true','1'].includes(l))return true;if(['falso','false','0'].includes(l))return false;throw new RunErr(M('Valore non valido: scrivi vero oppure falso','Invalid value: type true or false'))}
  return s;
}

/* ---------- esecuzione ---------- */
async function execute(prog,io,ctl){
  const env=new Map();ctl.env=env;
  const P=(src,what)=>{const r=parseC(src||'');if(r.err)throw new RunErr((what?what+': ':'')+r.err);return r.ast};
  const ev=a=>evalA(a,env);
  const cond=(src)=>{const v=ev(P(src,LAB.cond()));if(typeof v!=='boolean')throw new RunErr(M('La condizione deve essere vero o falso, non ','The condition must be true or false, not ')+kind(v));return v};
  const ident=s=>{const m=identErr(s);if(m)throw new RunErr(m);return s.trim()};
  const assign=(tg,val)=>{
    const v=env.get(tg.n);
    if(!v)throw new RunErr(M('La variabile "'+tg.n+'" non è stata dichiarata','Variable "'+tg.n+'" has not been declared'));
    if(tg.k==='idx'){
      if(!v.arr)throw new RunErr(M('"'+tg.n+'" non è un array','"'+tg.n+'" is not an array'));
      const i=ev(tg.i);
      if(!Number.isInteger(i)||i<0||i>=v.value.length)throw new RunErr(M('Indice fuori limiti: ','Index out of range: ')+tg.n+'['+fmt(i)+M('] (dimensione ','] (size ')+v.value.length+')');
      v.value[i]=coerce(v.type,val,tg.n);
    }else{
      if(v.arr)throw new RunErr(M('"'+tg.n+'" è un array: assegna un elemento, per esempio '+tg.n+'[0]','"'+tg.n+'" is an array: assign an element, for example '+tg.n+'[0]'));
      v.value=coerce(v.type,val,tg.n);
    }
  };
  const tgt=(src)=>{const a=P(src,LAB.var());if(a.k!=='var'&&a.k!=='idx')throw new RunErr(M('Deve essere una variabile','Must be a variable'));return a};
  async function seq(list){for(const n of list)await step(n)}
  async function step(n){
    try{
      switch(n.type){
        case 'comment':break;
        case 'declare':{
          await ctl.tick(n);
          const name=ident(n.name);
          if((n.size||'').trim()){
            const sz=ev(P(n.size,LAB.size()));
            if(!Number.isInteger(sz)||sz<0||sz>200000)throw new RunErr(M('Dimensione dell\'array non valida','Invalid array size'));
            env.set(name,{type:n.vt,arr:true,value:new Array(sz).fill(DEF[n.vt])});
          }else env.set(name,{type:n.vt,value:DEF[n.vt]});
          break}
        case 'assign':{await ctl.tick(n);const tg=tgt(n.target);assign(tg,ev(P(n.expr,LAB.expr())));break}
        case 'input':{
          await ctl.tick(n);
          const tg=tgt(n.name),v=env.get(tg.n);
          if(!v)throw new RunErr(M('La variabile "'+tg.n+'" non è stata dichiarata','Variable "'+tg.n+'" has not been declared'));
          for(;;){
            const raw=await io.input((n.prompt||'').trim()||(t('ui.enter')+tg.n),v.type,tg.n);
            let val;
            try{val=parseInput(raw,v.type)}catch(e){if(e instanceof RunErr){io.out(e.message+'\n','err');continue}throw e}
            assign(tg,val);break;
          }
          break}
        case 'output':{await ctl.tick(n);io.out(fmt(ev(P(n.expr,LAB.expr())))+(n.nl===false?'':'\n'));break}
        case 'if':{await ctl.tick(n);await seq(cond(n.cond)?n.yes:n.no);break}
        case 'while':{let wk=0;for(;;){await ctl.tick(n,{k:++wk});if(!cond(n.cond))break;await seq(n.body)}break}
        case 'do':{do{await seq(n.body);await ctl.tick(n,{ph:'check'})}while(cond(n.cond));break}
        case 'for':{
          await ctl.tick(n,{ph:'start'});
          const name=ident(n.v);
          const from=needNum(ev(P(n.from,LAB.from())),LAB.from()),to=needNum(ev(P(n.to,LAB.to())),LAB.to());
          const st=(n.step||'').trim()===''?1:needNum(ev(P(n.step,LAB.step())),LAB.step());
          if(st===0)throw new RunErr(M('Il passo non può essere 0','The step cannot be 0'));
          let v=env.get(name);
          if(!v){v={type:Number.isInteger(from)&&Number.isInteger(st)?'Integer':'Real',value:from};env.set(name,v)}
          if(v.arr)throw new RunErr(M('"'+name+'" è un array','"'+name+'" is an array'));
          let fk=0;
          for(let i=from;st>0?i<=to:i>=to;i+=st){
            v.value=coerce(v.type,i,name);
            await seq(n.body);
            await ctl.tick(n,{ph:'next',k:++fk});
          }
          break}
      }
    }catch(e){if(e instanceof RunErr&&!e.node)e.node=n;throw e}
  }
  await seq(prog.body);
}

/* ---------- costruzione e pulizia dei programmi ---------- */
let _id=0;const uid=()=>'n'+(++_id);
const mk={
  declare:()=>({id:uid(),type:'declare',vt:'Integer',name:'x',size:''}),
  assign:()=>({id:uid(),type:'assign',target:'x',expr:'0'}),
  input:()=>({id:uid(),type:'input',name:'x',prompt:''}),
  output:()=>({id:uid(),type:'output',expr:'"Hello"',nl:true}),
  if:()=>({id:uid(),type:'if',cond:'x > 0',yes:[],no:[]}),
  while:()=>({id:uid(),type:'while',cond:'x < 10',body:[]}),
  for:()=>({id:uid(),type:'for',v:'i',from:'1',to:'10',step:'1',body:[]}),
  do:()=>({id:uid(),type:'do',cond:'x < 10',body:[]}),
  comment:()=>({id:uid(),type:'comment',text:'Note'}),
};
function walk(list,f){for(const n of list){f(n);for(const k of ['yes','no','body'])if(n[k])walk(n[k],f)}}
function sanitize(list,depth=0){
  if(!Array.isArray(list)||depth>40)return [];
  const out=[];
  for(const n of list){
    if(!n||typeof n!=='object')continue;
    const ty=n.type==='leggi'?'input':n.type;
    if(!mk[ty])continue;
    const b=mk[ty]();
    for(const k of Object.keys(b)){
      if(k==='id')continue;
      if(Array.isArray(b[k]))b[k]=sanitize(n[k],depth+1);
      else if(typeof n[k]===typeof b[k]){b[k]=n[k];if(typeof b[k]==='string'&&b[k].length>500)b[k]=b[k].slice(0,500)}
    }
    if(n.bp===true&&ty!=='comment')b.bp=true;
    if(b.type==='declare'){if(OLDTYPES[b.vt])b.vt=OLDTYPES[b.vt];if(!TYPES.includes(b.vt))b.vt='Integer'}
    out.push(b);
  }
  return out;
}
const D=(vt,name,size='')=>({type:'declare',vt,name,size});
const A=(target,expr)=>({type:'assign',target,expr});
const I=(name,prompt='')=>({type:'input',name,prompt});
const O=(expr,nl=true)=>({type:'output',expr,nl});
const IF=(cond,yes,no=[])=>({type:'if',cond,yes,no});
const WH=(cond,body)=>({type:'while',cond,body});
const FR=(v,from,to,step,body)=>({type:'for',v,from,to,step,body});
const DO=(cond,body)=>({type:'do',cond,body});
const C=text=>({type:'comment',text});
const L2=(it,en)=>LANG==='it'?it:en;
const EXAMPLES=[

function tyOf(a,T){
  switch(a.k){
    case 'num':return Number.isInteger(a.v)?'int':'real';
    case 'str':return 'str';
    case 'bool':return 'bool';
    case 'var':return T[a.n]?T[a.n].t:(a.n==='pi'?'real':'int');
    case 'idx':return T[a.n]?T[a.n].t:'int';
    case 'un':return a.op==='not'?'bool':tyOf(a.e,T);
    case 'call':return FT[a.f](a.a.map(x=>tyOf(x,T)));
    case 'bin':{
      const o=a.op;
      if(['and','or','==','!=','<','>','<=','>='].includes(o))return 'bool';
      if(o==='&')return 'str';
      const l=tyOf(a.l,T),r=tyOf(a.r,T);
      if(o==='+'&&(l==='str'||r==='str'))return 'str';
      if(o==='/'||o==='^')return 'real';
      return l==='int'&&r==='int'?'int':'real';
    }
  }
}

/* ---------------- motore di generazione ---------------- */
function gen(prog,id){
  const L=LG[id],T={},decl=new Set(),warns=[],need={};
  const warn=m=>{if(!warns.includes(m))warns.push(m)};
  walk(prog.body,n=>{
    if(n.type==='declare'){const nm=(n.name||'').trim();if(IDENT.test(nm)){T[nm]={t:VT[n.vt]||'int',arr:!!(n.size||'').trim()};decl.add(nm)}}
  });
  const P0=src=>{const r=parseC(src||'');return r.ast||null};
  walk(prog.body,n=>{
    if(n.type==='for'){
      const v=(n.v||'').trim();
      if(IDENT.test(v)&&!T[v]){const f=P0(n.from),s=P0((n.step||'').trim()||'1');T[v]={t:(f&&s&&tyOf(f,T)==='int'&&tyOf(s,T)==='int')?'int':'real',arr:false}}
    }
  });
  const ty=a=>tyOf(a,T);
  const A_=src=>{const r=parseC(src||'');if(r.err){warn(M('Espressione non valida','Invalid expression')+': '+(src||'')+' ('+r.err+')');return null}return r.ast};
  const isCat=n=>n.k==='bin'&&(n.op==='&'||(n.op==='+'&&ty(n)==='str'));
  const flat=n=>isCat(n)?[...flat(n.l),...flat(n.r)]:[n];
  const coerceCode=(c,f,to)=>to==='int'&&f==='real'?L.toInt(c,need):to==='real'&&f==='int'?L.toReal(c):c;
  const num2=(l,lt,r,rt)=>{
    if(L.strictOps){if(lt==='int'&&rt==='real')l=L.toReal(l);else if(lt==='real'&&rt==='int')r=L.toReal(r)}
    return [l,r];
  };
  function E(a,top){
    switch(a.k){
      case 'num':return String(a.v);
      case 'str':return L.lit(a.v);
      case 'bool':return L.bool(a.v);
      case 'var':if(a.n==='pi'&&!T.pi){L.piNeed&&L.piNeed(need);return L.pi(need)}return L.v(a.n);
      case 'idx':return L.v(a.n)+'['+E(a.i,true)+']';
      case 'un':{
        if(a.op==='not')return L.ops.not+E(a.e,false);
        const s=E(a.e,false);return '-'+(s[0]==='-'?'('+s+')':s);
      }
      case 'call':return F(a);
      case 'bin':return B(a,top);
    }
  }
  function catStr(parts){
    if(!L.join){warn(M('Il concatenamento di testi non è tradotto in '+L.name+' fuori da Output e dalle assegnazioni.','Text concatenation is not translated in '+L.name+' outside Output and assignments.'));return '0'}
    const s=[];let acc=false;
    for(const p of parts){
      const t=ty(p),c=E(p,false);
      if(t==='str'){acc=true;s.push(L.strPart(c))}
      else if(L.autoStr==='all'||(L.autoStr==='left'&&acc))s.push(c);
      else{need.strh=1;s.push(L.toStr(c,t,need));acc=true}
    }
    return s.join(L.join);
  }
  function B(a,top){
    const o=a.op,lt=ty(a.l),rt=ty(a.r);
    let s;
    if(o==='and'||o==='or')s=E(a.l,false)+' '+L.ops[o]+' '+E(a.r,false);
    else if(isCat(a))s=catStr(flat(a));
    else if(o==='=='||o==='!='||o==='<'||o==='>'||o==='<='||o==='>='){
      let l=E(a.l,false),r=E(a.r,false);
      if(lt==='str'&&rt==='str'&&L.cmpStr)s=L.cmpStr(o,l,r);
      else{
        [l,r]=num2(l,lt,r,rt);
        const op=o==='=='?L.ops.eq:o==='!='?L.ops.ne:o;
        s=l+' '+op+' '+r;
      }
    }
    else if(o==='/')s=L.div(E(a.l,false),E(a.r,false),lt,rt);
    else if(o==='%'){const real=lt==='real'||rt==='real';L.modNeed&&L.modNeed(need,real);s=L.mod(E(a.l,false),E(a.r,false),real,lt,rt)}
    else if(o==='^'){
      let l=E(a.l,false),r=E(a.r,false);
      if(L.strictOps||L.strictFn){if(lt==='int')l=L.toReal(l);if(rt==='int')r=L.toReal(r)}
      L.powNeed&&L.powNeed(need);
      s=L.pow(l,r);
    }
    else{const [l,r]=num2(E(a.l,false),lt,E(a.r,false),rt);s=l+' '+o+' '+r}
    return top?s:'('+s+')';
  }
  function F(a){
    const name=a.f,ats=a.a.map(ty);
    if(name==='len'&&a.a[0].k==='var'&&T[a.a[0].n]&&T[a.a[0].n].arr)return L.arrLen(L.v(a.a[0].n));
    let args=a.a.map(x=>E(x,true));
    if(L.strictFn&&REALARGS.has(name))args=args.map((c,i)=>ats[i]==='int'?L.toReal(c):c);
    const tpl=L.fn[name];
    if(tpl==null){warn(M(name+'() non è tradotta in '+L.name+'.',name+'() is not translated in '+L.name+'.'));return '0 /* '+name+'() */'}
    L.fnNeed(name,need);
    if(typeof tpl==='function')return tpl(args,ats);
    return tpl.replace(/\$(\d)/g,(m,d)=>args[d-1]);
  }
  const X={E,flat,ty,need,warn,T};
  const out=[];
  const push=(d,s)=>out.push(L.ind.repeat(d+L.base)+s);
  const ex=(src,top=true)=>{const a=A_(src);return a?E(a,top):'0'};
  const tgt=src=>{
    const a=A_(src);
    if(!a||(a.k!=='var'&&a.k!=='idx'))return {code:'/* ? */',t:'int',ast:null,name:'x'};
    return {code:E(a,true),t:ty(a),ast:a,name:a.n};
  };
  function block(list,d){
    if(!list.length&&L.pass){push(d,L.pass);return}
    for(const n of list)stmt(n,d);
  }
  function stmt(n,d){
    switch(n.type){
      case 'comment':for(const l of (n.text||'').split('\n'))push(d,(L.cmt+' '+l).trimEnd());break;
      case 'declare':{
        const nm=(n.name||'').trim();
        if(!IDENT.test(nm)){warn(M('Nome di variabile non valido: ','Invalid variable name: ')+nm);break}
        const sz=(n.size||'').trim();let szc=null,sza=null;
        if(sz){sza=A_(sz);szc=sza?coerceCode(E(sza,true),ty(sza),'int'):'0'}
        L.decl(nm,VT[n.vt]||'int',szc,sza,X).forEach(l=>push(d,l));
        break}
      case 'assign':{
        const tg=tgt(n.target),a=A_(n.expr);
        const v=a?coerceCode(E(a,true),ty(a),tg.t):'0';
        L.assign(tg,v,a,X).forEach(l=>push(d,l));
        break}
      case 'input':{
        const tg=tgt(n.name);
        const pb=((n.prompt||'').trim()||(t('ui.enter')+tg.name));
        const pr=/[?:.!]\s*$/.test(pb)?pb+' ':pb+': ';
        L.input(tg,pr,X).forEach(l=>push(d,l));
        break}
      case 'output':{
        const a=A_(n.expr)||{k:'num',v:0};
        L.output(X,a,n.nl!==false).forEach(l=>push(d,l));
        break}
      case 'if':
        push(d,L.ifO(ex(n.cond)));block(n.yes,d+1);
        if(n.no.length){push(d,L.els);block(n.no,d+1)}
        if(L.end)push(d,L.end);
        break;
      case 'while':push(d,L.whO(ex(n.cond)));block(n.body,d+1);if(L.end)push(d,L.end);break;
      case 'do':
        push(d,L.doO);block(n.body,d+1);
        L.doC(ex(n.cond)).forEach(([o,s])=>push(d+o,s));
        break;
      case 'for':{
        const v=(n.v||'').trim();
        if(!IDENT.test(v)){warn(M('Nome di variabile non valido: ','Invalid variable name: ')+v);break}
        const fa=A_(n.from)||{k:'num',v:0},ta=A_(n.to)||{k:'num',v:0},sSrc=(n.step||'').trim()||'1',sa=A_(sSrc)||{k:'num',v:1};
        const lit=sa.k==='num'?sa.v:(sa.k==='un'&&sa.op==='-'&&sa.e.k==='num')?-sa.e.v:null;
        const vt=T[v].t,ft=ty(fa),tt=ty(ta),st=ty(sa);
        const vc=L.v(v);
        let fc=coerceCode(E(fa,true),ft,vt),tc=E(ta,true),sc=E(sa,true);
        let vcmp=vc;
        if(L.strictOps){
          if(vt==='real'&&tt==='int')tc=L.toReal(tc);
          else if(vt==='int'&&tt==='real')vcmp=L.toReal(vc);
          if(vt==='real'&&st==='int')sc=L.toReal(sc);
        }
        const cond=lit!==null?`${vcmp} ${lit<0?'>=':'<='} ${tc}`:`((${sc}) > 0 && ${vcmp} <= ${tc}) || ((${sc}) < 0 && ${vcmp} >= ${tc})`;
        const f={v:vc,vt,isNew:!decl.has(v),fc,tc,sc,lit,cond,ft,tt,st};
        const r=L.forO(f);
        r.open.forEach(([o,s])=>push(d+o,s));block(n.body,d+1);r.close.forEach(([o,s])=>push(d+o,s));
        break}
    }
  }
  block(prog.body,0);
  const hdr=L.cmt+' EDUFLOW: '+(prog.name||'');
  const lines=[...L.pre(need,hdr),...out,...L.post(need)];
  return {code:lines.join('\n')+'\n',warns,notes:L.notes.map(n=>M(n[0],n[1]))};
}

function mSeq(list){
  let l=18,r=18,h=GAP;
  for(const n of list){mNode(n);l=Math.max(l,n._m.l);r=Math.max(r,n._m.r);h+=n._m.h+GAP}

}
function head(n,txt){

  const hw=Math.max(140,tw*1.5+56);

}
function mNode(n){
  n._err=nodeErrors(n);
  const lab=label(n),ty=n.type;
  if(ty==='if'||ty==='while'||ty==='for'||ty==='do'){
    const txt=trunc(lab,ty==='for'?40:26),H=head(n,txt);
    const m={txt,...H};
    if(ty==='if'){
      const Y=mSeq(n.yes),N=mSeq(n.no);

      m.Dl=Math.max(H.hw/2,Y.r+14);m.Dr=Math.max(H.hw/2,N.l+14);
      m.l=m.Dl+Y.l;m.r=m.Dr+N.r;m.h=H.hh+Math.max(Y.h,N.h);
    }else{
      const B=mSeq(n.body);m.B=B;
      m.l=Math.max(H.hw/2,B.l)+LANE;
      m.r=Math.max(H.hw/2,B.r)+(ty==='do'?14:LANE);

      return s;

    let s=gOpen(n)+shapeSvg(m.shape,cx,y,hw,hh)+'<text x="'+cx+'" y="'+yc+'">'+esc(m.txt)+'</text>'+bpDot(n,cx-hw/2,y)+'</g>';

    return s;
  }

/* ---------- cronologia e salvataggio ---------- */
const snap=()=>JSON.stringify(prog,(k,v)=>k[0]==='_'?undefined:v);
function commit(key){
  const s=snap();
  if(s!==hist[hi]){
    const now=Date.now();
    if(key&&key===lastKey&&now-lastT<1200&&hi===hist.length-1&&hi>0)hist[hi]=s;
    else{hist.length=hi+1;hist.push(s);if(hist.length>200)hist.shift();hi=hist.length-1}
    lastKey=key||'';lastT=now;
    clearTimeout(saveT);saveT=setTimeout(save,300);
  }
  render();updateUndo();
}
function save(){try{localStorage.setItem('flussi.v1',snap())}catch(e){}}
function updateUndo(){$('#undo').disabled=locked||hi<=0;$('#redo').disabled=locked||hi>=hist.length-1}
function restore(s){
  const o=JSON.parse(s);prog={name:o.name||t('ui.untitled'),body:o.body};
  let mx=0;walk(prog.body,n=>{mx=Math.max(mx,parseInt(String(n.id).slice(1))||0)});_id=Math.max(_id,mx);
  $('#pname').value=prog.name;render();renderProps();
}
function undo(){if(locked||hi<=0)return;hi--;lastKey='';restore(hist[hi]);updateUndo();save()}
function redo(){if(locked||hi>=hist.length-1)return;hi++;lastKey='';restore(hist[hi]);updateUndo();save()}
function loadProgram(o){
  prog={name:String(o.name||t('ui.untitled')).slice(0,60),body:sanitize(o.body)};
  selId=null;$('#pname').value=prog.name;
  hist=[snap()];hi=0;lastKey='';
  render();renderProps();updateUndo();save();
  zoom=1;applyZoom();if(dim.W>board.clientWidth)fit();
  board.scrollTo(0,0);
}

function cloneNode(n){const c=JSON.parse(JSON.stringify(n,(k,v)=>k[0]==='_'?undefined:v));walk([c],x=>{x.id=uid()});return c}
function dupSel(){

/* ---------- trascinamento blocchi (dal pannello e sulla tavola) ---------- */
let drag=null,noClickUntil=0;
const ghost=document.createElement('div');ghost.className='dragghost';ghost.hidden=true;document.body.appendChild(ghost);
function startDrag(e,kind,val,srcEl){
  if(locked||spaceHeld||e.button!==0||e.pointerType==='touch')return;
  drag={kind,val,srcEl,x:e.clientX,y:e.clientY,on:false,sl:null,bad:null};
}
function invalidLists(id){
  const set=new Set(),n=byId.get(id),p=parents.get(id);
  walk([n],x=>{for(const k of ['yes','no','body'])if(x[k])set.add(x[k])});
  return {set,p};
}
function dragBegin(){
  drag.on=true;document.body.classList.add('dragging');hideTip();closeMenu();
  const ty=drag.kind==='new'?drag.val:(byId.get(drag.val)||{}).type;
  ghost.textContent=BN[ty]||'';ghost.hidden=false;
  if(drag.srcEl)drag.srcEl.classList.add('dragsrc');
  drag.bad=drag.kind==='move'?invalidLists(drag.val):null;
  const all=[...host.querySelectorAll('.slot')];
  drag.slots=all.map(el=>{
    const sl=slots[+el.dataset.s];let ok=true;
    if(drag.bad){
      const {set,p}=drag.bad;
      if(set.has(sl.list))ok=false;
      else if(sl.list===p.list&&(sl.i===p.i||sl.i===p.i+1))ok=false;
    }
    el.classList.toggle('nodrop',!ok);el.classList.add('dropping');
    return {el,sl,ok};
  });
}
function dragMove(e){
  if(!drag)return;
  if(!drag.on){if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<7)return;dragBegin()}
  ghost.style.left=(e.clientX+14)+'px';ghost.style.top=(e.clientY+14)+'px';
  const b=board.getBoundingClientRect();
  if(e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom){
    if(e.clientY<b.top+36)board.scrollTop-=14;else if(e.clientY>b.bottom-36)board.scrollTop+=14;
    if(e.clientX<b.left+36)board.scrollLeft-=14;else if(e.clientX>b.right-36)board.scrollLeft+=14;
  }
  let best=null,bd=56*56;
  for(const s of drag.slots){
    if(!s.ok)continue;const r=s.el.getBoundingClientRect(),dx=r.left+r.width/2-e.clientX,dy=r.top+r.height/2-e.clientY,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=s}
  }
  if(drag.sl!==best){if(drag.sl)drag.sl.el.classList.remove('drop');if(best)best.el.classList.add('drop');drag.sl=best}
}
function dragEnd(e,cancel){
  if(!drag)return;const d=drag;drag=null;
  if(!d.on)return;
  document.body.classList.remove('dragging');ghost.hidden=true;noClickUntil=Date.now()+350;
  host.querySelectorAll('.slot').forEach(el=>el.classList.remove('drop','dropping','nodrop'));
  if(d.srcEl)d.srcEl.classList.remove('dragsrc');
  if(cancel||!d.sl)return;
  const sl=d.sl.sl;
  if(d.kind==='new')insertNode(sl.list,sl.i,d.val);
  else{
    const p=parents.get(d.val);if(!p)return;
    const n=p.list[p.i];let idx=sl.i;
    if(sl.list===p.list&&p.i<idx)idx--;
    p.list.splice(p.i,1);sl.list.splice(idx,0,n);selId=n.id;
    commit('move');renderProps();
    const el=host.querySelector('[data-id="'+n.id+'"]');if(el)reveal(el);
  }
}

host.addEventListener('pointerdown',e=>{
  const nd=e.target.closest('.nd[data-id]');

});
addEventListener('pointermove',dragMove);
addEventListener('pointerup',e=>dragEnd(e,false));

addEventListener('keydown',e=>{if(e.key==='Escape'&&drag&&drag.on)dragEnd(e,true)},true);

function tipHtml(el){
  const key=el.dataset.tip||'';let ty=null,node=null;
  if(el.classList.contains('nd')&&el.dataset.id){node=byId.get(el.dataset.id);ty=node&&node.type}
  else if(key.startsWith('blk:'))ty=key.slice(4);
  if(ty){
    const b=t('blk.'+ty),g=t('tip.tags');
    let h='<div class="th"><span>'+BN[ty]+'</span></div><p><b>'+esc(b.short)+'</b></p><p class="dim">'+esc(b.long)+'</p>'
     +'<div class="tl">'+g.fields+'</div><ul>'+b.fields.map(f=>'<li><b>'+esc(f[0])+'.</b> '+esc(f[1])+'</li>').join('')+'</ul>'
     +'<div class="tl">'+g.example+'</div><code>'+esc(b.example)+'</code>'
     +'<div class="tl">'+g.tip+'</div><p class="dim">'+esc(b.tip)+'</p>';
    if(node&&node._err&&node._err.length)h='<p class="terr"><b>'+esc(t('msg.wrongNode'))+'</b>'+esc(node._err.join(' · '))+'</p>'+h;
    return h;
  }
  if(key.startsWith('ui:')){
    const d=t('tip.'+key.slice(3));if(!d||typeof d!=='object')return '';
    return '<div class="th"><span>'+esc(d.t)+'</span>'+(d.k?'<kbd>'+esc(d.k)+'</kbd>':'')+'</div><p>'+esc(d.d)+'</p>';
  }
  return '';
}
function placeTip(){
  const r=tipEl.getBoundingClientRect(),pad=12;
  let x=tipX+16,y=tipY+18;
  if(x+r.width>innerWidth-pad)x=Math.max(pad,tipX-r.width-12);
  if(y+r.height>innerHeight-pad)y=Math.max(pad,tipY-r.height-12);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}
function showTip(el){
  if(!el.isConnected||!SET.tips)return;
  const h=tipHtml(el);if(!h)return;
  tipEl.innerHTML=h;tipEl.hidden=false;tipShown=true;placeTip();
}
function hideTip(){clearTimeout(tipTimer);tipTarget=null;if(tipShown){tipEl.hidden=true;tipShown=false}}
document.addEventListener('pointerover',e=>{
  if(!SET.tips||e.pointerType==='touch'||!modal.hidden&&!e.target.closest('#modal'))return;
  const el=e.target.closest('[data-tip],.nd[data-id]');
  if(!el){hideTip();return}
  if(el===tipTarget)return;
  hideTip();tipTarget=el;tipX=e.clientX;tipY=e.clientY;
  tipTimer=setTimeout(()=>showTip(el),320);
});
document.addEventListener('pointermove',e=>{tipX=e.clientX;tipY=e.clientY;if(tipShown)placeTip()});
document.addEventListener('pointerdown',hideTip);
document.addEventListener('keydown',hideTip);
document.addEventListener('scroll',hideTip,true);
document.addEventListener('pointerleave',hideTip);
document.addEventListener('focusin',e=>{
  if(!SET.tips)return;
  const el=e.target.closest&&e.target.closest('[data-tip]');
  if(el&&e.target.matches(':focus-visible')){const r=el.getBoundingClientRect();hideTip();tipTarget=el;tipX=r.left;tipY=r.bottom-14;showTip(el)}
});
document.addEventListener('focusout',hideTip);

/* ---------- esecuzione ---------- */
const DELAYS=[900,400,120,20,0];
const yieldNow=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>r();c.port2.postMessage(0)});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let ctl=null,runState='idle',inputWait=null;
let curId=null,varsDirty=false,markDirty=false,rafId=0,outBuf=[],failId=null,prevVars=new Map();
let statusFn=()=>t('ui.ready');
function setStatus(f){statusFn=typeof f==='string'?()=>f:f;$('#status').textContent=statusFn()}
function schedule(){if(!rafId)rafId=requestAnimationFrame(flush)}
function flush(){
  rafId=0;
  if(outBuf.length){
    const frag=document.createDocumentFragment();
    for(const [tx,c] of outBuf){const s=document.createElement('span');if(c)s.className=c;s.textContent=tx;frag.appendChild(s)}
    outBuf=[];conEl.appendChild(frag);
    while(conEl.childNodes.length>4000)conEl.removeChild(conEl.firstChild);
    conEl.scrollTop=conEl.scrollHeight;
  }
  if(varsDirty){varsDirty=false;renderVars();updateWatch()}
  if(markDirty){markDirty=false;markApply(false)}
}
function markApply(keepScroll){
  const old=host.querySelector('.nd.run,.nd.fail');
  if(old&&old.dataset.id!==curId&&old.dataset.id!==failId)old.classList.remove('run','fail');
  const el=curId&&host.querySelector('[data-id="'+curId+'"]');
  if(el){
    if(failId===curId){el.classList.remove('run');el.classList.add('fail')}else el.classList.add('run');
    if(!keepScroll)reveal(el);
  }
}
function renderVars(){
  const env=ctl&&ctl.env;
  const head='<h4>'+esc(t('ui.vars'))+'</h4>';
  if(!env||!env.size){varsEl.innerHTML=head+'<p class="help" style="margin:0">'+esc(t('ui.varsEmpty'))+'</p>';prevVars=new Map();return}
  let h=head+'<table><tr><th>'+esc(t('ui.name'))+'</th><th>'+esc(t('ui.type'))+'</th><th>'+esc(t('ui.value'))+'</th></tr>';
  const nv=new Map();
  for(const [k,v] of env){
    const val=v.arr?'['+v.value.slice(0,40).map(fmt).join(', ')+(v.value.length>40?', …':'')+']':(v.type==='String'?JSON.stringify(v.value):fmt(v.value));
    nv.set(k,val);
    h+='<tr'+(prevVars.has(k)&&prevVars.get(k)!==val?' class="chg"':'')+'><td>'+esc(k)+'</td><td>'+esc(tl(v.type))+(v.arr?'[]':'')+'</td><td>'+esc(val)+'</td></tr>';
  }
  prevVars=nv;varsEl.innerHTML=h+'</table>';
}
function updateWatch(){
  const src=($('#watchIn').value||'').trim(),o=$('#watchOut');
  if(!src){o.textContent='';o.className='wout';return}
  const r=parseC(src);
  if(r.err){o.textContent=r.err;o.className='wout bad';return}
  const env=ctl&&ctl.env;
  if(!env||!env.size){o.textContent='—';o.className='wout';return}
  try{const v=evalA(r.ast,env);o.textContent='= '+(typeof v==='string'?JSON.stringify(v):fmt(v));o.className='wout'}
  catch(e){o.textContent=e.message;o.className='wout bad'}
}
$('#watchIn').addEventListener('input',()=>{SET.watch=$('#watchIn').value;saveSet();updateWatch()});
function out(text,cls){outBuf.push([text,cls||'']);schedule()}
function setBtns(){
  const idle=runState==='idle',paused=ctl&&ctl.paused;
  $('#bRun').disabled=!idle&&!paused;
  $('#bRun span').textContent=!idle&&paused?t('ui.cont'):t('ui.run');
  $('#bStep').disabled=!idle&&!paused;
  $('#bPause').disabled=idle||paused;
  $('#bStop').disabled=idle;
  $('#pname').disabled=!idle;$('#examples').disabled=!idle;
  ['bNew','bImport','bLib'].forEach(i=>$('#'+i).disabled=!idle);
}
function lock(on){
  locked=on;document.body.classList.toggle('running',on);
  propsEl.querySelectorAll('fieldset').forEach(f=>f.disabled=on);updateUndo();
}
const TRACE_MAX=600;let lastTrace=null;
function snapVars(env){
  const m={};
  for(const [k,v] of env)m[k]=v.arr?'['+v.value.slice(0,12).map(fmt).join(', ')+(v.value.length>12?', …':'')+']':(v.type==='String'?JSON.stringify(v.value):fmt(v.value));
  return m;
}
function traceTick(c,n){
  const tr=c.trace;tr.total++;
  if(tr.pending&&tr.rows.length<TRACE_MAX)tr.rows.push({step:tr.pending.step,label:tr.pending.label,vars:snapVars(c.env)});
  tr.pending=tr.rows.length<TRACE_MAX?{step:tr.total,label:BN[n.type]+': '+label(n)}:null;
}
function makeCtl(paused){
  const c={paused,stopped:false,steps:0,waiter:null,env:null,last:0};
  c.tick=async function(n,ph){
    if(c.stopped)throw new StopErr();
    curId=n.id;markDirty=true;varsDirty=true;schedule();
    if(c.trace)traceTick(c,n);
    if(n.bp&&!c.paused&&!c.stopped)c.paused=true;
    if(tOn()&&!c.stopped){c.ph=ph;tutorTick(c,n,ph);if(!c.free)c.paused=true}
    if(++c.steps>30000000)throw new RunErr(M('Il programma sembra non terminare: troppi passi eseguiti','The program seems to never end: too many steps executed'));
    if(c.paused){setStatus(()=>t('ui.paused'));setBtns();await new Promise(r=>{c.waiter=r});c.waiter=null;setStatus(()=>t('ui.running'));setBtns()}
    else{
      const d=DELAYS[+$('#speed').value];
      if(d>0)await sleep(d);
      else if(performance.now()-c.last>10){await yieldNow();c.last=performance.now()}
    }
    if(c.stopped)throw new StopErr();
  };
  return c;
}
const io={
  out,
  input(msg,type){
    return new Promise((res,rej)=>{
      inputWait={res,rej};
      $('#inprompt').textContent=msg+' ('+tl(type)+')';
      $('#inform').hidden=false;$('#inval').value='';$('#inval').focus();
      setStatus(()=>t('ui.waiting'));
      if(tOn())tRender();
    });
  }
};
function submitInput(v){
  if(!inputWait)return;
  const w=inputWait;inputWait=null;
  $('#inform').hidden=true;out(v+'\n','in');setStatus(()=>t('ui.running'));w.res(v);
  if(tOn())tRender();
}
/* niente invio del <form>: in una pagina incorporata senza "allow-forms" il browser lo blocca */
$('#inform').addEventListener('submit',e=>{e.preventDefault();submitInput($('#inval').value)});
$('#inval').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitInput($('#inval').value)}});
$('#inform').addEventListener('click',e=>{const b=e.target.closest('button');if(b){e.preventDefault();submitInput($('#inval').value)}});
async function startRun(paused){
  if(SET.hideR){SET.hideR=false;saveSet();applyPanels()}
  conEl.textContent='';outBuf=[];prevVars=new Map();failId=null;curId=null;
  if(tOn())tutorStart();ctl=makeCtl(paused||tOn());ctl.trace={rows:[],pending:null,total:0};runState='running';lock(true);setBtns();setStatus(()=>t('ui.running'));renderVars();
  const t0=performance.now();
  try{
    await execute(prog,io,ctl);
    out('\n'+t('ui.endLine')+'\n','sys');if(tOn())tutorEnd('done');
    const steps=ctl.steps,ms=Math.round(performance.now()-t0);
    setStatus(()=>t('ui.finished',steps,ms));
  }catch(e){
    if(e instanceof StopErr){out('\n'+t('ui.stopLine')+'\n','sys');if(tOn())tutorEnd('stop');setStatus(()=>t('ui.stopped'))}
    else if(e instanceof RunErr){
      out('\n'+t('ui.errPrefix')+e.message+'\n','err');if(tOn())tutorEnd('err',e);setStatus(()=>t('ui.error'));
      if(e.node){failId=e.node.id;curId=e.node.id;markDirty=true}
    }else{out('\n'+t('ui.internalErr')+e.message+'\n','err');setStatus(()=>t('ui.error'))}
  }finally{
    runState='idle';inputWait=null;$('#inform').hidden=true;
    const c=ctl;varsDirty=true;
    if(c.trace){const tr=c.trace;if(tr.pending&&tr.rows.length<TRACE_MAX&&c.env)tr.rows.push({step:tr.pending.step,label:tr.pending.label,vars:snapVars(c.env)});lastTrace=tr}
    if(!failId)curId=null;
    markDirty=true;schedule();lock(false);setBtns();
    ctl=c;ctl.paused=false;setBtns();if(tOn())tRender();
    if(!failId){const o=host.querySelector('.nd.run');if(o)o.classList.remove('run')}
  }
}
function doRun(){
  if(runState==='idle'){if(!prog.body.length){setStatus(()=>t('ui.emptyDiagram'));return}startRun(tOn())}
  else if(ctl.paused){ctl.paused=false;if(ctl.waiter)ctl.waiter()}
}
function doStep(){
  if(runState==='idle'){if(!prog.body.length){setStatus(()=>t('ui.emptyDiagram'));return}startRun(true)}
  else if(ctl.paused&&ctl.waiter){ctl.waiter()}
}
function doPause(){if(runState!=='idle'){ctl.paused=true;setBtns()}}
function doStop(){
  if(runState==='idle')return;
  ctl.stopped=true;ctl.paused=false;
  if(ctl.waiter)ctl.waiter();
  if(inputWait){const w=inputWait;inputWait=null;$('#inform').hidden=true;w.rej(new StopErr())}
}
$('#bRun').onclick=doRun;$('#bStep').onclick=doStep;$('#bPause').onclick=doPause;$('#bStop').onclick=doStop;
function setSpeedLabel(){$('#speedL').textContent=t('ui.speedN')[+$('#speed').value]}
$('#speed').addEventListener('input',()=>{setSpeedLabel();SET.speed=+$('#speed').value;saveSet()});

const tutorEl=$('#tutorCard');
let tut=null;
const tOn=()=>!!SET.tutor,tBeg=()=>SET.tlevel!=='std',tPredOn=()=>SET.tpred!==false;
const tA=w=>/^[aeiou]/i.test(w)?'an':'a';
const cd=s=>'<code>'+esc(s)+'</code>';
function tShow(v){return typeof v==='string'?JSON.stringify(v):typeof v==='boolean'?(v?M('VERO','TRUE'):M('FALSO','FALSE')):fmt(v)}
function tEval(src){
  try{const r=parseC(src||'');if(r.err||!ctl||!ctl.env)return null;return {v:evalA(r.ast,ctl.env)}}catch(e){return null}
}
function tSubst(src){
  if(!ctl||!ctl.env)return String(src);
  return String(src).split(/("(?:[^"\\]|\\.)*")/).map((p,i)=>i%2?p:p.replace(/[A-Za-z_À-ÿ][\wÀ-ÿ]*(?![\wÀ-ÿ]*\s*[\(\[])/g,m=>{const v=ctl.env.get(m);return v&&!v.arr?tShow(v.value):m})).join('');
}
const tSame=(a,b)=>String(a).replace(/\s+/g,'')===String(b).replace(/\s+/g,'');
function tShowSub(src){const s=tSubst(src);return tSame(s,src)?cd(src):cd(src)+' → '+cd(s)}
function tText(n,ph){
  const B=tBeg(),ty=n.type;let o={head:BN[ty],body:'',after:'',pred:null};
  switch(ty){
    case 'declare':{
      const nm=(n.name||'').trim(),vt=tl(n.vt),sz=(n.size||'').trim();
      if(sz){const s=tEval(sz);const k=s?tShow(s.v):sz;
        o.body=B?M('Creo una <b>fila di '+esc(k)+' scatole</b> numerate da 0 a '+esc(s?String(s.v-1):k+'-1')+', tutte con l\'etichetta '+cd(nm)+'. In ognuna può stare un valore di tipo '+esc(vt)+'. All\'inizio sono tutte a '+esc(tShow(DEF[n.vt]))+'.','I create a <b>row of '+esc(k)+' boxes</b> numbered 0 to '+esc(s?String(s.v-1):k+'-1')+', all labelled '+cd(nm)+'. Each can hold '+tA(vt)+' '+esc(vt)+' value. At first they are all '+esc(tShow(DEF[n.vt]))+'.')
          :M('Dichiaro l\'array '+cd(nm)+' di '+esc(vt)+' con '+esc(k)+' elementi (indici da 0).','Declares array '+cd(nm)+' of '+esc(vt)+' with '+esc(k)+' elements (indexes from 0).');
      }else o.body=B?M('Creo una <b>scatola</b> con l\'etichetta '+cd(nm)+'. Nella scatola può stare solo un valore di tipo <b>'+esc(vt)+'</b>. All\'inizio contiene '+esc(tShow(DEF[n.vt]))+'. Senza questo blocco, il programma non saprebbe che '+cd(nm)+' esiste.','I create a <b>box</b> labelled '+cd(nm)+'. It can only hold '+tA(vt)+' <b>'+esc(vt)+'</b> value. At first it contains '+esc(tShow(DEF[n.vt]))+'. Without this block the program would not know '+cd(nm)+' exists.')
        :M('Dichiara la variabile '+cd(nm)+' di tipo '+esc(vt)+' (valore iniziale '+esc(tShow(DEF[n.vt]))+').','Declares variable '+cd(nm)+' of type '+esc(vt)+' (initial value '+esc(tShow(DEF[n.vt]))+').');
      break}
    case 'assign':{
      const e=tEval(n.expr),tg=(n.target||'').trim(),old=ctl.env.get(tg);
      if(!e){o.body=M('Sto per mettere il risultato di '+cd(n.expr)+' dentro '+cd(tg)+'.','About to store the result of '+cd(n.expr)+' in '+cd(tg)+'.');break}
      const oldTxt=old&&!old.arr?M(' Quello che c\'era prima ('+esc(tShow(old.value))+') viene cancellato.',' What was there before ('+esc(tShow(old.value))+') is erased.'):'';
      o.body=B?M('Prima calcolo la parte a destra: '+tShowSub(n.expr)+', che fa <b>'+esc(tShow(e.v))+'</b>. Poi metto '+esc(tShow(e.v))+' nella scatola '+cd(tg)+'.'+oldTxt+' Attenzione: il simbolo = qui significa «metti dentro», non «è uguale a».','First I calculate the right-hand side: '+tShowSub(n.expr)+', which gives <b>'+esc(tShow(e.v))+'</b>. Then I put '+esc(tShow(e.v))+' into the box '+cd(tg)+'.'+oldTxt+' Careful: here = means “put inside”, not “is equal to”.')
        :M(cd(tg)+' ← '+tShowSub(n.expr)+' = <b>'+esc(tShow(e.v))+'</b>.'+oldTxt,cd(tg)+' ← '+tShowSub(n.expr)+' = <b>'+esc(tShow(e.v))+'</b>.'+oldTxt);
      break}
    case 'input':{
      const tg=(n.name||'').trim(),v=ctl.env.get(tg);
      o.body=B?M('Il programma <b>si ferma e aspetta te</b>: scrivi un valore nella casella della console (qui sotto) e premi Invio. Quello che scrivi finisce nella scatola '+cd(tg)+(v?', che accetta solo valori di tipo <b>'+esc(tl(v.type))+'</b>':'')+'.','The program <b>stops and waits for you</b>: type a value in the console box below and press Enter. What you type goes into the box '+cd(tg)+(v?', which only accepts <b>'+esc(tl(v.type))+'</b> values':'')+'.')
        :M('Legge un valore dalla console e lo salva in '+cd(tg)+(v?' ('+esc(tl(v.type))+')':'')+'.','Reads a value from the console and stores it in '+cd(tg)+(v?' ('+esc(tl(v.type))+')':'')+'.');
      break}
    case 'output':{
      const e=tEval(n.expr);
      o.body=e?(B?M('Calcolo '+tShowSub(n.expr)+': fa <b>'+esc(tShow(e.v))+'</b>. Poi lo scrivo nella console, così lo puoi leggere'+(n.nl===false?' (senza andare a capo)':' e vado a capo')+'.','I calculate '+tShowSub(n.expr)+': it gives <b>'+esc(tShow(e.v))+'</b>. Then I write it to the console so you can read it'+(n.nl===false?' (without a new line)':' and start a new line')+'.')
        :M('Scrive nella console: '+tShowSub(n.expr)+' = <b>'+esc(tShow(e.v))+'</b>.','Writes to the console: '+tShowSub(n.expr)+' = <b>'+esc(tShow(e.v))+'</b>.'))
        :M('Sto per scrivere nella console il valore di '+cd(n.expr)+'.','About to write the value of '+cd(n.expr)+' to the console.');
      break}
    case 'if':case 'while':case 'do':{
      const c=tEval(n.cond),isB=c&&typeof c.v==='boolean';
      const k=ph&&ph.k;
      let intro;
      if(ty==='if')intro=B?M('Qui il programma deve <b>scegliere una strada</b>. Controlla la condizione '+cd(n.cond)+'. Con i valori di adesso: '+tShowSub(n.cond)+'.','Here the program has to <b>choose a path</b>. It checks the condition '+cd(n.cond)+'. With the current values: '+tShowSub(n.cond)+'.')
        :M('Se '+tShowSub(n.cond)+'…','If '+tShowSub(n.cond)+'…');
      else if(ty==='while')intro=B?M((k>1?'Siamo tornati all\'inizio del ciclo. Prima':'Inizia un ciclo While: prima')+' di ogni giro il programma controlla la condizione '+cd(n.cond)+' (controllo n. '+(k||1)+'). Adesso: '+tShowSub(n.cond)+'.',(k>1?'We are back at the top of the loop. Before':'A While loop starts: before')+' each turn the program checks the condition '+cd(n.cond)+' (check no. '+(k||1)+'). Now: '+tShowSub(n.cond)+'.')
        :M('While, controllo n. '+(k||1)+': '+tShowSub(n.cond),'While, check no. '+(k||1)+': '+tShowSub(n.cond));
      else intro=B?M('Il corpo del Do While è stato eseguito <b>almeno una volta</b>. Ora controllo la condizione '+cd(n.cond)+': '+tShowSub(n.cond)+'.','The Do While body ran <b>at least once</b>. Now I check the condition '+cd(n.cond)+': '+tShowSub(n.cond)+'.')
        :M('Do While, controllo: '+tShowSub(n.cond),'Do While, check: '+tShowSub(n.cond));
      o.body=intro;
      if(isB){
        const r=c.v;
        o.pred={val:r};
        o.after=ty==='if'?(r?M('La condizione è <b>VERA</b>, quindi il programma prende il ramo «Sì».','The condition is <b>TRUE</b>, so the program takes the “Yes” branch.'):M('La condizione è <b>FALSA</b>, quindi il programma prende il ramo «No».','The condition is <b>FALSE</b>, so the program takes the “No” branch.'))
          :ty==='while'?(r?M('È <b>VERA</b>: eseguo le istruzioni del ciclo, poi torno qui a ricontrollare.','It is <b>TRUE</b>: I run the loop body, then come back here to check again.'):M('È <b>FALSA</b>: il ciclo finisce e il programma continua sotto.','It is <b>FALSE</b>: the loop ends and the program goes on below.'))
          :(r?M('È <b>VERA</b>: il Do While <b>ripete</b> il corpo del ciclo.','It is <b>TRUE</b>: the Do While <b>repeats</b> the loop body.'):M('È <b>FALSA</b>: esco dal ciclo e il programma continua.','It is <b>FALSE</b>: I leave the loop and the program goes on.'));
      }
      break}
    case 'for':{
      const nm=(n.v||'').trim();
      if(ph&&ph.ph==='next'){
        const cur=ctl.env.get(nm),s=tEval((n.step||'').trim()===''?'1':n.step),to=tEval(n.to);
        if(cur&&s&&to&&typeof s.v==='number'&&typeof to.v==='number'){
          const nx=cur.value+s.v,go=s.v>0?nx<=to.v:nx>=to.v;
          o.body=B?M('Il giro n. '+ph.k+' è finito. Ora '+cd(nm)+' passa da '+esc(tShow(cur.value))+' a <b>'+esc(tShow(nx))+'</b> e il programma controlla se è ancora dentro il limite ('+esc(tShow(to.v))+'): '+(go?'<b>sì</b>, si fa un altro giro.':'<b>no</b>, il ciclo For finisce.'),'Turn no. '+ph.k+' is over. Now '+cd(nm)+' goes from '+esc(tShow(cur.value))+' to <b>'+esc(tShow(nx))+'</b> and the program checks whether it is still within the limit ('+esc(tShow(to.v))+'): '+(go?'<b>yes</b>, another turn.':'<b>no</b>, the For loop ends.'))
            :M('Fine giro '+ph.k+': '+cd(nm)+' '+esc(tShow(cur.value))+' → '+esc(tShow(nx))+(go?', continua.':', fine del ciclo.'),'End of turn '+ph.k+': '+cd(nm)+' '+esc(tShow(cur.value))+' → '+esc(tShow(nx))+(go?', continues.':', loop ends.'));

function pasteClip(src){
  if(locked||!src)return;
  let o;try{o=JSON.parse(src)}catch(e){return}

  if(!n)return;

  if(selId&&parents.has(selId)){const p=parents.get(selId);list=p.list;idx=p.i+1}

}

function svgExportText(){

  (function inline(o,c){

    c.setAttribute('style',st);c.removeAttribute('class');c.removeAttribute('data-id');c.removeAttribute('data-tip');
    const oc=[...o.children],cc=[...c.children];
    oc.forEach((ch,i)=>{if(ch.classList&&ch.classList.contains('slot')){cc[i].remove();return}inline(ch,cc[i])});

  bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill',getComputedStyle(document.body).backgroundColor);

async function saveFile(name,data){
  let dls=null;try{dls=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(dls){try{await dls.save({filename:name,data});return true}catch(e){if(e&&e.code==='declined')return false}}
  const bl=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');
  a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true;
}
function lightSvg(){
  const r=document.documentElement,prev=r.getAttribute('data-theme');
  r.setAttribute('data-theme','light');
  let s;try{s=svgExportText()}finally{if(prev===null)r.removeAttribute('data-theme');else r.setAttribute('data-theme',prev)}
  return s;
}
function svgToCanvas(svg,scale){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const w=Math.max(1,Math.round(dim.W*scale)),h=Math.max(1,Math.round(dim.H*scale));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);res(cv);
    };
    img.onerror=()=>rej(new Error('img'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
const canvasBlob=(cv,type,q)=>new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),type,q));
function pdfBuild(title,jpg,jw,jh,codeLines){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const objs=[];const W=595,H=842,M0=40;
  const lat=s=>String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E -ÿ]/g,'?');
  const esc2=s=>lat(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  // pagina 1: titolo + immagine
  const maxW=W-2*M0,maxH=H-2*M0-40,sc=Math.min(maxW/jw,maxH/jh,1),dw=jw*sc,dh=jh*sc;
  const pages=[];
  pages.push('BT /F2 16 Tf '+M0+' '+(H-M0-10)+' Td ('+esc2(title)+') Tj ET\nq '+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+M0+' '+(H-M0-40-dh).toFixed(2)+' cm /Im0 Do Q');
  if(codeLines&&codeLines.length){
    const per=Math.floor((H-2*M0)/10.5),cols=95;
    const wrapped=[];for(const l of codeLines){let s=l.replace(/\t/g,'  ');if(!s.length)wrapped.push('');while(s.length>cols){wrapped.push(s.slice(0,cols));s='    '+s.slice(cols)}if(s.length)wrapped.push(s)}
    for(let i=0;i<wrapped.length;i+=per){
      let c='BT /F1 8.5 Tf 10.5 TL '+M0+' '+(H-M0)+' Td\n';
      for(const l of wrapped.slice(i,i+per))c+='('+esc2(l)+') Tj T*\n';
      pages.push(c+'ET');
    }
  }
  // oggetti: 1 catalog, 2 pages, 3 F1, 4 F2, 5 image, poi (pagina, contenuto) a coppie
  const kids=[];
  const o=[];
  o[1]='<< /Type /Catalog /Pages 2 0 R >>';
  o[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>';
  o[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pages.forEach((c,i)=>{
    const pn=6+i*2,cn=pn+1;kids.push(pn+' 0 R');
    o[pn]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>'+(i===0?' /XObject << /Im0 5 0 R >>':'')+' >> /Contents '+cn+' 0 R >>';
    o[cn]={stream:Uint8Array.from(c,ch=>ch.charCodeAt(0)&255),dict:''};
  });
  o[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
  o[5]={stream:jpg,dict:'/Type /XObject /Subtype /Image /Width '+jw+' /Height '+jh+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode'};
  push('%PDF-1.4\n');
  for(let i=1;i<o.length;i++){
    offs[i]=len;push(i+' 0 obj\n');
    if(typeof o[i]==='string')push(o[i]);
    else{const s=o[i].stream;push('<< '+o[i].dict+' /Length '+s.length+' >>\nstream\n');push(s);push('\nendstream')}
    push('\nendobj\n');
  }
  const xr=len;push('xref\n0 '+o.length+'\n0000000000 65535 f \n');
  for(let i=1;i<o.length;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+o.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(len);let p=0;for(const b of parts){out.set(b,p);p+=b.length}
  return out;
}

async function doDownload(k,btn){
  const msg=$('#dlmsg'),base=fileBase();let ok=true;
  const say=s=>{if(msg)msg.textContent=s};
  try{
    if(k==='json')ok=await saveFile(base+'.json',new Blob([JSON.stringify({app:'eduflow',version:2,name:prog.name,body:JSON.parse(snap()).body},null,1)],{type:'application/json'}));
    else if(k==='svg')ok=await saveFile(base+'.svg',new Blob([svgExportText()],{type:'image/svg+xml'}));
    else if(k==='png'){const cv=await svgToCanvas(lightSvg(),Math.min(3,3000/Math.max(dim.W,dim.H)));ok=await saveFile(base+'.png',await canvasBlob(cv,'image/png'))}
    else if(k==='pdf'||k==='pdfcode'){
      const cv=await svgToCanvas(lightSvg(),Math.min(2.5,2500/Math.max(dim.W,dim.H)));
      const jb=await canvasBlob(cv,'image/jpeg',0.92),jpg=new Uint8Array(await jb.arrayBuffer());
      const code=k==='pdfcode'?gen(prog,'cpp').code.replace(/\n$/,'').split('\n'):null;
      ok=await saveFile(base+(code?'_'+M('codice','code'):'')+'.pdf',new Blob([pdfBuild(prog.name||'EDUFLOW',jpg,cv.width,cv.height,code)],{type:'application/pdf'}));
    }
    else if(k.startsWith('code:')){const id=k.slice(5);ok=await saveFile(LG[id].file,new Blob([gen(prog,id).code],{type:'text/plain'}))}
    say(ok?M('Fatto: controlla i file scaricati.','Done: check your downloads.'):M('Salvataggio annullato.','Save cancelled.'));
  }catch(e){say(M('Non sono riuscito a creare il file: ','Could not create the file: ')+(e&&e.message||''))}
}

  else if(b.hasAttribute('data-dlk')){doDownload(b.dataset.dlk,b)}
  else if(b.hasAttribute('data-copy')){const ta=$('#expTa');copyText(ta.value,b,ta)}
  else if(b.hasAttribute('data-copytsv'))copyText(sheet.dataset.tsv||'',b,null)
  else if(b.dataset.etab)showExport(b.dataset.etab)
  else if(b.dataset.ch){chRes=null;openChallenges(b.dataset.ch)}
  else if(b.dataset.chact){
    const ch=CH.find(x=>x.id===chSel),act=b.dataset.chact;
    if(act==='hint'){const h=$('#chhint');if(h)h.hidden=!h.hidden}
    else if(act==='check')checkChallenge(chSel);
    else if(runState!=='idle')return;
    else if(act==='start'){loadProgram({name:ch.t[chI()],body:[]});SET.active=ch.id;saveSet();closeModal();location.hash='diagram';showView();renderChbar()}
    else if(act==='sol'){prog={name:ch.t[chI()],body:sanitize(ch.sol())};selId=null;commit('sol');renderProps();SET.active=ch.id;saveSet();renderChbar();closeModal();location.hash='diagram';showView();setStatus(()=>t('ui.chSolNote'))}
  }
  else if(b.hasAttribute('data-imp'))doImport();
  else if(b.hasAttribute('data-new')){prog={name:t('ui.untitled'),body:[]};$('#pname').value=prog.name;selId=null;clearActive();commit('new');renderProps();closeModal()}
});

/* ---------- pagina Codice ---------- */
const KW=new Set(('abstract and as async await begin bool boolean break case catch char class const continue def default defer do double elif else elsif end enum extends false final finally float fn for foreach from fun func function global if implements import in include int interface is let long loop new nil none not null package private protected public pub range readonly repeat return self static stride string struct switch then this throw true try typeof until use using val var void when while yield Int Double String Bool Boolean Integer Float Long').split(/\s+/));
const HLRE={
  hash:/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(#.*)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/g,
  slash:/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\/\/.*)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/g,
};
function hl(line,id){
  if((id==='c'||id==='cpp')&&/^\s*#/.test(line))return '<span class="pp">'+esc(line)+'</span>';
  const re=HLRE[id==='py'||id==='rb'?'hash':'slash'];re.lastIndex=0;
  let res='',last=0,m;
  while((m=re.exec(line))){
    res+=esc(line.slice(last,m.index));last=m.index+m[0].length;
    const tx=esc(m[0]);
    if(m[1]!==undefined)res+='<span class="s">'+tx+'</span>';
    else if(m[2]!==undefined)res+='<span class="c">'+tx+'</span>';
    else if(m[3]!==undefined)res+='<span class="n">'+tx+'</span>';
    else res+=KW.has(m[0])?'<span class="k">'+tx+'</span>':tx;
  }
  return res+esc(line.slice(last));
}
let cvLang='js',cvAll=false;const cvCodes={};
function cvCard(id){
  const L=LG[id],r=gen(prog,id),lines=r.code.replace(/\n$/,'').split('\n');
  cvCodes[id]=r.code;
  const tested=TESTED.includes(id);
  const nts=[...r.notes,...r.warns];
  return '<article class="cc" id="cc-'+id+'"><header><div><h3>'+esc(L.name)+'</h3><span class="fn">'+esc(L.file)+' · '+esc(t('ui.lines',lines.length))+'</span></div><button class="btn" data-copy="'+id+'">'+esc(t('ui.copy'))+'</button></header>'
   +'<pre class="code" tabindex="0"><code>'+lines.map(l=>'<span class="l">'+hl(l,id)+'</span>').join('')+'</code></pre>'
   +'<div class="how"><b>'+esc(t('ui.cvHow'))+':</b> <code>'+esc(L.run)+'</code></div>'
   +'<div class="badge'+(tested?' ok':'')+'">'+esc(tested?t('ui.cvTested'):t('ui.cvUntested'))+'</div>'
   +(nts.length?'<ul class="nts">'+nts.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')
   +'</article>';
}
function renderCode(){
  $('#cvProg').textContent=prog.name||'';

  main.innerHTML='<p class="hint">'+esc(t('ui.cvNote'))+'</p>'+(cvAll?LANGS:[cvLang]).map(cvCard).join('');
}

/* ---------- tastiera ---------- */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='Escape'){if(!modal.hidden)closeModal();else closeMenu();return}
  if(!modal.hidden)return;
  const mod=e.ctrlKey||e.metaKey;
  if(!$('#codeview').hidden)return;
  if(mod&&e.key==='Enter'){e.preventDefault();doRun();return}
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(e.altKey&&e.key.toLowerCase()==='f'){e.preventDefault();toggleFocus();return}
  if(e.key==='F10'){e.preventDefault();doStep();return}
  if(e.key==='F9'){e.preventDefault();toggleBp();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel();return}
  if(e.key==='Delete'||(e.key==='Backspace'&&document.activeElement===document.body)){if(selId){e.preventDefault();deleteSel()}}
});

})();
